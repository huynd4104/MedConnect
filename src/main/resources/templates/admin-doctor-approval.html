<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Phê duyệt bác sĩ - MedConnect</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <th:block th:replace="~{fragments/header :: firebase-scripts}"></th:block>

    <style>
        /* Import font giống doctor-dashboard.html */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }

        /* Gradient text giống doctor-dashboard.html */
        .gradient-text {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* Table container giống doctor-dashboard.html */
        .table-container {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            border-radius: 1rem; /* 1rem = rounded-2xl */
            border: 1px solid rgba(0, 0, 0, 0.05);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            overflow: hidden; /* Thêm để bo góc cho table header */
        }

        /* Styles cho modal (giữ nguyên từ file gốc) */
        .modal {
            transition: opacity 0.25s ease;
        }
        .modal-active {
            overflow-x: hidden;
            overflow-y: visible !important;
        }

        /* --- THÊM PHẦN NÀY --- */
        .custom-scrollbar::-webkit-scrollbar {
            width: 8px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 10px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #a78bfa; /* purple-400 */
            border-radius: 10px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #8b5cf6; /* purple-500 */
        }
        /* --- HẾT PHẦN THÊM --- */
    </style>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col antialiased">
<div th:replace="~{fragments/header :: header}"></div>

<section class="container mx-auto py-16 px-4">
    <div th:if="${pendingDoctors.empty}" class="mb-8 p-6 bg-yellow-100 border border-yellow-400 text-yellow-700 rounded-2xl text-center flex items-center justify-center">
        <i class="fas fa-info-circle mr-2"></i> Không có hồ sơ bác sĩ nào đang chờ duyệt.
    </div>

    <div class="bg-white p-6 md:p-8 rounded-2xl border border-gray-100 shadow-xl" th:unless="${pendingDoctors.empty}">

        <h2 class="text-3xl font-semibold mb-6 text-gray-900 flex items-center">
            <i class="fas fa-user-check mr-3 text-purple-600"></i> Danh sách bác sĩ chờ phê duyệt
        </h2>

        <div class="table-container">
            <table class="w-full table-auto min-w-max border-collapse">
                <thead class="bg-purple-50 text-purple-700">
                <tr>
                    <th class="py-3 px-4 text-left font-semibold text-sm rounded-tl-xl">Họ và tên</th>
                    <th class="py-3 px-4 text-left font-semibold text-sm">Email</th>
                    <th class="py-3 px-4 text-center w-3/5 font-semibold text-sm rounded-tr-xl">Hành động</th>
                </tr>
                </thead>
                <tbody class="divide-y divide-gray-200">
                <tr th:each="doctor : ${pendingDoctors}" class="transition duration-200 hover:bg-gray-50">
                    <td class="p-3 align-top" th:text="${doctor.fullName}"></td>
                    <td class="p-3 align-top" th:text="${doctor.user.email}"></td>
                    <td class="p-3 flex flex-col md:flex-row gap-2 items-center justify-center">

                        <button th:attr="data-doctor-id=${doctor.doctorId},
                                     data-fullname=${doctor.fullName ?: doctor.user.email},
                                     data-email=${doctor.user.email},
                                     data-phone=${doctor.phoneNumber ?: 'Chưa cập nhật'},
                                     data-address=${doctor.clinicAddress ?: 'Chưa cập nhật'},
                                     data-specialization=${doctor.specialization?.name ?: 'Chưa cập nhật'},
                                     data-experience=${doctor.experienceYears},
                                     data-license=${doctor.licenseNumber ?: 'Chưa cập nhật'},
                                     data-status=${doctor.status},
                                     data-reason=${doctor.rejectionReason ?: ''},
                                     data-photo-path=${doctor.photoPath ?: ''},
                                     data-introduction=${doctor.introduction ?: ''}" class="details-btn bg-blue-500 text-white px-4 py-2 rounded-xl hover:bg-blue-600 transition transform hover:-translate-y-0.5 hover:shadow-lg flex items-center justify-center text-sm">
                            <i class="fas fa-info-circle mr-2"></i> Chi tiết
                        </button>

                        <form th:action="@{/admin-approve-doctor}" method="post" class="inline-block">
                            <input type="hidden" name="doctorId" th:value="${doctor.doctorId}" />
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                            <input type="hidden" name="approve" value="true" />
                            <button type="submit" class="bg-green-500 text-white px-4 py-2 rounded-xl hover:bg-green-600 transition transform hover:-translate-y-0.5 hover:shadow-lg flex items-center text-sm">
                                <i class="fas fa-check mr-2"></i> Phê duyệt
                            </button>
                        </form>

                        <button type="button"
                                th:attr="data-doctor-id=${doctor.doctorId}"
                                class="reject-modal-btn bg-red-500 text-white px-4 py-2 rounded-xl hover:bg-red-600 transition transform hover:-translate-y-0.5 hover:shadow-lg flex items-center text-sm">
                            <i class="fas fa-times mr-2"></i> Từ chối
                        </button>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</section>

<div id="doctorDetailsModal" class="modal fixed w-full h-full top-0 left-0 flex items-center justify-center hidden z-50 p-4">
    <div class="modal-overlay absolute w-full h-full bg-gray-900 opacity-50"></div>

    <div class="modal-container bg-white w-11/12 md:max-w-5xl mx-auto rounded-2xl shadow-lg z-50">

        <div class="modal-content py-6 px-8 text-left">
            <div class="flex justify-between items-center pb-3 border-b mb-6">
                <p class="text-2xl font-bold text-gray-900 flex items-center">
                    <i class="fas fa-user-md mr-3 text-purple-600"></i>
                    Chi tiết Hồ sơ Bác sĩ
                </p>
                <button class="modal-close text-gray-400 hover:text-gray-700 text-3xl">&times;</button>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">

                <!-- Cột ảnh -->
                <div class="md:col-span-1 bg-gray-50 rounded-lg shadow-inner overflow-hidden flex-shrink-0"
                     style="height: 360px; max-width: 250px; margin: auto;">
                    <img id="modal-photo" src="" alt="Ảnh đại diện"
                         class="w-full h-full object-cover hidden">
                    <div id="modal-photo-placeholder"
                         class="w-full h-full bg-gray-100 flex items-center justify-center hidden">
                        <i class="fas fa-user-md text-5xl text-gray-400"></i>
                    </div>
                </div>

                <!-- Cột thông tin cơ bản -->
                <div class="md:col-span-1 bg-gray-50 rounded-lg shadow-inner p-4 flex flex-col justify-between"
                     style="height: 360px;">
                    <div class="space-y-3 text-gray-700 text-sm md:text-base">
                        <p><strong>Họ và tên:</strong> <span id="modal-fullname"></span></p>
                        <p><strong>Email:</strong> <span id="modal-email"></span></p>
                        <p><strong>Số điện thoại:</strong> <span id="modal-phone"></span></p>
                        <p><strong>Địa chỉ phòng khám:</strong> <span id="modal-address"></span></p>
                        <p><strong>Chuyên khoa:</strong> <span id="modal-specialization"></span></p>
                        <p><strong>Số năm kinh nghiệm:</strong> <span id="modal-experience"></span></p>
                        <p><strong>Số giấy phép:</strong> <span id="modal-license"></span></p>
                    </div>
                </div>

                <!-- Cột giới thiệu -->
                <div class="md:col-span-1 bg-gray-50 rounded-lg shadow-inner p-4 flex flex-col justify-between"
                     style="height: 360px;">
                    <div class="space-y-3 text-gray-700 text-sm md:text-base flex-grow">
                        <p class="mb-2"><strong>Giới thiệu:</strong></p>
                        <div class="bg-white p-3 rounded-xl border border-gray-200 text-gray-600 leading-relaxed h-full overflow-y-auto custom-scrollbar">
                            <span id="modal-introduction" class="block text-sm italic whitespace-pre-wrap"></span>
                        </div>
                    </div>
                </div>
            </div>

            <div class="mt-6 pt-6 border-t">
                <p class="text-lg font-bold text-purple-600 mb-2">
                    <i class="fas fa-folder-open mr-2"></i> Giấy tờ đã tải lên:
                </p>
                <div id="modal-documents-list" class="space-y-2 max-h-32 overflow-y-auto custom-scrollbar">
                    <p id="modal-documents-loading" class="text-sm text-gray-500 italic">Đang tải...</p>
                </div>
            </div>
        </div>
    </div>
</div>
<div id="rejectReasonModal" class="modal fixed w-full h-full top-0 left-0 flex items-center justify-center hidden z-50 p-4">
    <div class="modal-overlay absolute w-full h-full bg-gray-900 opacity-50"></div>

    <div class="modal-container bg-white w-11/12 md:max-w-md mx-auto rounded-2xl shadow-lg z-50 overflow-y-auto">
        <form id="rejectForm" th:action="@{/admin-approve-doctor}" method="post" class="modal-content py-4 text-left px-6">
            <div class="flex justify-between items-center pb-3 border-b">
                <p class="text-2xl font-bold text-red-600">Lý do từ chối</p>
            </div>

            <div class="mt-4 space-y-4">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                <input type="hidden" name="doctorId" id="reject-doctor-id" />
                <input type="hidden" name="approve" value="false" />

                <div>
                    <label for="reason" class="block text-sm font-medium text-gray-700">Vui lòng nhập lý do từ chối (bắt buộc):</label>
                    <textarea id="reason" name="reason" rows="4"
                              class="w-full p-2 mt-1 border border-gray-300 rounded-xl focus:ring-red-500 focus:border-red-500 text-sm"
                              required></textarea>
                </div>
            </div>

            <div class="flex justify-end pt-4 mt-4 border-t">
                <button type="button" class="modal-close-reject px-4 bg-gray-200 p-3 rounded-xl text-gray-800 hover:bg-gray-300 mr-2 font-medium">
                    Hủy
                </button>
                <button type="submit" class="px-4 bg-red-500 text-white p-3 rounded-xl hover:bg-red-600 font-medium">
                    Xác nhận Từ chối
                </button>
            </div>
        </form>
    </div>
</div>
<div th:replace="~{fragments/footer :: footer}"></div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const modal = document.getElementById('doctorDetailsModal');
        const overlay = modal.querySelector('.modal-overlay');
        const closeButtons = modal.querySelectorAll('.modal-close');
        const detailButtons = document.querySelectorAll('.details-btn');
        const documentsListDiv = document.getElementById('modal-documents-list');
        const documentsLoadingMsg = document.getElementById('modal-documents-loading');

        const openModal = (doctorData) => {
            const photoElement = document.getElementById('modal-photo');
            const placeholderElement = document.getElementById('modal-photo-placeholder');
            const photoPath = doctorData.photoPath; // Lấy từ data-photo-path

            // Hiển thị ảnh hoặc placeholder
            if (photoPath && photoPath.trim() !== '') {
                photoElement.src = photoPath;
                photoElement.classList.remove('hidden');
                placeholderElement.classList.add('hidden');
            } else {
                photoElement.classList.add('hidden');
                placeholderElement.classList.remove('hidden'); // Hiển thị placeholder
            }

            // Điền dữ liệu vào modal
            document.getElementById('modal-fullname').textContent = doctorData.fullname;
            document.getElementById('modal-email').textContent = doctorData.email;
            document.getElementById('modal-phone').textContent = doctorData.phone;
            document.getElementById('modal-address').textContent = doctorData.address;
            document.getElementById('modal-specialization').textContent = doctorData.specialization;
            document.getElementById('modal-experience').textContent = doctorData.experience;
            document.getElementById('modal-license').textContent = doctorData.license;
            document.getElementById('modal-introduction').textContent = doctorData.introduction || 'Chưa cập nhật';

            // 2. Reset và hiển thị loading cho danh sách giấy tờ
            documentsListDiv.innerHTML = ''; // Xóa nội dung cũ
            documentsListDiv.appendChild(documentsLoadingMsg); // Thêm lại text "Đang tải..."
            documentsLoadingMsg.textContent = "Đang tải...";
            documentsLoadingMsg.style.display = 'block';

            // 3. Mở modal
            modal.classList.remove('hidden');
            document.body.classList.add('modal-active');

            // 4. Fetch danh sách giấy tờ
            fetch(`/api/admin/doctors/${doctorData.doctorId}/documents`)
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Không thể tải danh sách giấy tờ');
                    }
                    return response.json();
                })
                .then(documents => {
                    documentsLoadingMsg.style.display = 'none'; // Ẩn "Đang tải..."

                    if (documents.length === 0) {
                        documentsListDiv.innerHTML = '<p class="text-sm text-gray-500 italic">Không có giấy tờ nào được tải lên.</p>';
                    } else {
                        // Tạo danh sách link
                        documents.forEach(doc => {
                            // (doc.fileName lấy từ @Transient trong DoctorDocument.java)
                            const docLink = document.createElement('a');
                            docLink.href = doc.filePath;
                            docLink.textContent = doc.fileName || 'Xem file';
                            docLink.target = '_blank';
                            // Đổi màu link text-indigo-600 -> text-purple-600
                            docLink.className = 'block text-purple-600 hover:text-purple-800 hover:underline text-sm';

                            const icon = document.createElement('i');
                            icon.className = 'fas fa-file-alt mr-2 text-gray-500'; // Thêm icon
                            docLink.prepend(icon);

                            documentsListDiv.appendChild(docLink);
                        });
                    }
                })
                .catch(error => {
                    console.error('Error fetching documents:', error);
                    documentsLoadingMsg.textContent = "Lỗi khi tải giấy tờ.";
                    documentsLoadingMsg.className = "text-sm text-red-500 italic";
                });
        };

        const closeModal = () => {
            modal.classList.add('hidden');
            document.body.classList.remove('modal-active');

            // (MỚI) Reset ảnh về trạng thái ẩn ban đầu
            document.getElementById('modal-photo').classList.add('hidden');
            document.getElementById('modal-photo').src = ""; // Xóa src
            document.getElementById('modal-photo-placeholder').classList.add('hidden');

            // Reset trạng thái loading khi
            documentsLoadingMsg.textContent = "Đang tải...";
            documentsLoadingMsg.className = "text-sm text-gray-500 italic";
            documentsListDiv.innerHTML = ''; // Xóa sạch nội dung
        };

        // Gắn sự kiện click cho các nút "Chi tiết"
        detailButtons.forEach(button => {
            button.addEventListener('click', (event) => {
                const buttonData = event.currentTarget.dataset;
                openModal(buttonData);
            });
        });

        // Gắn sự kiện click cho nút đóng và overlay
        closeButtons.forEach(button => button.addEventListener('click', closeModal));
        overlay.addEventListener('click', closeModal);

        //  MODAL TỪ CHỐI
        const modalReject = document.getElementById('rejectReasonModal');
        const overlayReject = modalReject.querySelector('.modal-overlay');
        const closeButtonsReject = modalReject.querySelectorAll('.modal-close-reject');
        const rejectButtons = document.querySelectorAll('.reject-modal-btn');
        const rejectDoctorIdInput = document.getElementById('reject-doctor-id');
        const rejectForm = document.getElementById('rejectForm');
        const reasonTextarea = document.getElementById('reason');

        const openModalReject = (doctorId) => {
            // Gán doctorId vào trường ẩn của form
            rejectDoctorIdInput.value = doctorId;
            // Xóa lý do cũ
            reasonTextarea.value = '';
            // Hiển thị modal
            modalReject.classList.remove('hidden');
            document.body.classList.add('modal-active');
        };

        const closeModalReject = () => {
            modalReject.classList.add('hidden');
            document.body.classList.remove('modal-active');
            rejectDoctorIdInput.value = '';
            reasonTextarea.value = '';
        };

        // Gắn sự kiện click cho các nút "Từ chối" trên bảng
        rejectButtons.forEach(button => {
            button.addEventListener('click', (event) => {
                const doctorId = event.currentTarget.dataset.doctorId;
                openModalReject(doctorId);
            });
        });

        // Gắn sự kiện click cho nút đóng và overlay của modal từ chối
        closeButtonsReject.forEach(button => button.addEventListener('click', closeModalReject));
        overlayReject.addEventListener('click', closeModalReject);

        // Đóng cả 2 modal bằng phím Esc
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                if (!modal.classList.contains('hidden')) {
                    closeModal();
                }
                if (!modalReject.classList.contains('hidden')) {
                    closeModalReject();
                }
            }
        });
    });
</script>
</body>
</html>
