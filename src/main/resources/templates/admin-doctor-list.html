<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Danh sách Bác sĩ - Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-r from-blue-100 to-indigo-100 min-h-screen flex flex-col">
<div th:replace="~{fragments/header :: header}"></div>

<section class="container mx-auto py-12">
    <h1 class="text-3xl font-bold mb-6 text-center">Quản lý Danh sách Bác sĩ</h1>
    <div class="bg-white rounded-lg shadow-md overflow-hidden">
        <table class="w-full">
            <thead class="bg-gray-200">
            <tr>
                <th class="p-4 text-left">Email</th>
                <th class="p-4 text-left">Chuyên khoa</th>
                <th class="p-4 text-left">Kinh nghiệm (năm)</th>
                <th class="p-4 text-left">Trạng thái</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="doctor : ${doctors}" class="hover:bg-gray-100 border-b">
                <td class="p-4" th:text="${doctor.user.email}"></td>
                <td class="p-4" th:text="${doctor.specialization} ? ${doctor.specialization.name} : 'Chưa cập nhật'"></td>
                <td class="p-4" th:text="${doctor.experienceYears}"></td>
                <td class="p-4" th:text="${doctor.status}"></td>
            </tr>
            <tr th:if="${#lists.isEmpty(doctors)}">
                <td colspan="4" class="p-4 text-center text-gray-500">Không có bác sĩ nào trong hệ thống.</td>
            </tr>
            </tbody>
        </table>
    </div>
</section>
</body>
</html>
