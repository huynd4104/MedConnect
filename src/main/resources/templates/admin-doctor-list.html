<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Danh sách Bác sĩ - Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gradient-to-r from-blue-50 to-indigo-100 min-h-screen flex flex-col font-sans antialiased">
<div th:replace="~{fragments/header :: header}"></div>

<section class="container mx-auto py-12 px-4 md:px-0">
    <h1 class="text-4xl font-bold mb-8 text-center text-indigo-800 drop-shadow-md">Quản lý Danh sách Bác sĩ</h1>

    <div class="bg-white p-6 md:p-8 rounded-xl shadow-lg mx-4 md:mx-8 overflow-x-auto">
        <h2 class="text-2xl font-semibold mb-6 text-indigo-700 flex items-center">
            <i class="fas fa-user-md mr-2 text-indigo-500"></i> Danh sách bác sĩ
        </h2>
        <table class="w-full table-auto min-w-max border-collapse">
            <thead class="bg-indigo-100 text-indigo-800">
            <tr>
                <th class="p-3 text-left">Họ và Tên</th>
                <th class="p-3 text-left">Email</th>
                <th class="p-3 text-left">Chuyên khoa</th>
                <th class="p-3 text-left">Kinh nghiệm (năm)</th>
                <th class="p-3 text-left">Trạng thái</th>
            </tr>
            </thead>
            <tbody class="divide-y divide-gray-200">
            <tr th:each="doctor : ${doctors}" class="transition duration-200 hover:bg-gray-50">
                <td class="p-3" th:text="${doctor.fullName}"></td>
                <td class="p-3" th:text="${doctor.user.email}"></td>
                <td class="p-3" th:text="${doctor.specialization} ? ${doctor.specialization.name} : 'Chưa cập nhật'"></td>
                <td class="p-3" th:text="${doctor.experienceYears}"></td>
                <td class="p-3" th:text="${doctor.status}"></td>
            </tr>
            <tr th:if="${#lists.isEmpty(doctors)}">
                <td colspan="4" class="p-3 text-center text-gray-600">Không có bác sĩ nào trong hệ thống.</td>
            </tr>
            </tbody>
        </table>
    </div>
</section>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
