<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Xem hồ sơ bác sĩ - MedConnect</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gradient-to-r from-blue-50 to-indigo-100 min-h-screen flex flex-col font-sans antialiased">
<div th:replace="~{fragments/header :: header}"></div>

<section class="container mx-auto py-12 px-4 md:px-0">
    <h1 class="text-4xl font-bold mb-8 text-center text-indigo-800 drop-shadow-md">Hồ sơ bác sĩ</h1>

    <!-- Thông báo lỗi -->
    <div th:if="${error}" class="mt-4 p-4 bg-red-100 border border-red-400 text-red-700 rounded-xl mx-4 md:mx-8 text-center" th:text="${error}"></div>

    <!-- Thông tin bác sĩ -->
    <div class="bg-white p-6 md:p-8 rounded-xl shadow-lg mx-4 md:mx-8 mb-8 transform transition duration-300">
        <div class="flex flex-col md:flex-row gap-8">
            <img th:src="@{${doctor.photoPath}}" alt="Bác sĩ" class="w-48 h-48 object-cover rounded-full shadow-lg">
            <div class="flex-1">
                <h2 th:text="${doctor.user.email}" class="text-2xl font-semibold text-indigo-700 mb-2"></h2>
                <p th:text="${doctor.specialization.name}" class="text-gray-600 text-lg mb-2"></p>
                <p th:text="'Kinh nghiệm: ' + ${doctor.experienceYears} + ' năm'" class="text-gray-600 mb-4"></p>
                <a th:href="@{/book-appointment(doctorId=${doctor.doctorId})}"
                   sec:authorize="hasRole('Patient')"
                   class="bg-indigo-500 text-white px-6 py-3 rounded-lg font-semibold hover:bg-indigo-600 transition flex items-center w-fit">
                    <i class="fas fa-calendar-plus mr-2"></i> Đặt lịch
                </a>
            </div>
        </div>
    </div>

    <!-- Lịch trống -->
    <div class="bg-white p-6 md:p-8 rounded-xl shadow-lg mx-4 md:mx-8 mb-8 transform transition duration-300">
        <h2 class="text-2xl font-semibold mb-6 text-indigo-700 flex items-center">
            <i class="fas fa-calendar mr-2 text-indigo-500"></i> Lịch trống
        </h2>
        <div th:if="${schedules.empty}" class="text-center text-gray-600">Không có lịch trống</div>
        <div th:unless="${schedules.empty}" class="overflow-x-auto">
            <table class="min-w-full divide-y divide-gray-200 bg-white rounded-lg shadow-sm">
                <thead class="bg-indigo-100">
                <tr>
                    <th class="w-1/7 px-4 py-3 text-center text-sm font-medium text-indigo-700">Thứ 2</th>
                    <th class="w-1/7 px-4 py-3 text-center text-sm font-medium text-indigo-700">Thứ 3</th>
                    <th class="w-1/7 px-4 py-3 text-center text-sm font-medium text-indigo-700">Thứ 4</th>
                    <th class="w-1/7 px-4 py-3 text-center text-sm font-medium text-indigo-700">Thứ 5</th>
                    <th class="w-1/7 px-4 py-3 text-center text-sm font-medium text-indigo-700">Thứ 6</th>
                    <th class="w-1/7 px-4 py-3 text-center text-sm font-medium text-indigo-700">Thứ 7</th>
                    <th class="w-1/7 px-4 py-3 text-center text-sm font-medium text-indigo-700">Chủ Nhật</th>
                </tr>
                </thead>
                <tbody class="divide-y divide-gray-200">
                <tr>
                    <td class="px-4 py-4 text-center text-sm text-gray-600">
                        <ul class="pl-4">
                            <li th:each="schedule : ${schedules}" th:if="${schedule.dayOfWeek == 2}" th:text="${schedule.startTime} + ' - ' + ${schedule.endTime}"></li>
                        </ul>
                    </td>
                    <td class="px-4 py-4 text-center text-sm text-gray-600">
                        <ul class="pl-4">
                            <li th:each="schedule : ${schedules}" th:if="${schedule.dayOfWeek == 3}" th:text="${schedule.startTime} + ' - ' + ${schedule.endTime}"></li>
                        </ul>
                    </td>
                    <td class="px-4 py-4 text-center text-sm text-gray-600">
                        <ul class="pl-4">
                            <li th:each="schedule : ${schedules}" th:if="${schedule.dayOfWeek == 4}" th:text="${schedule.startTime} + ' - ' + ${schedule.endTime}"></li>
                        </ul>
                    </td>
                    <td class="px-4 py-4 text-center text-sm text-gray-600">
                        <ul class="pl-4">
                            <li th:each="schedule : ${schedules}" th:if="${schedule.dayOfWeek == 5}" th:text="${schedule.startTime} + ' - ' + ${schedule.endTime}"></li>
                        </ul>
                    </td>
                    <td class="px-4 py-4 text-center text-sm text-gray-600">
                        <ul class="pl-4">
                            <li th:each="schedule : ${schedules}" th:if="${schedule.dayOfWeek == 6}" th:text="${schedule.startTime} + ' - ' + ${schedule.endTime}"></li>
                        </ul>
                    </td>
                    <td class="px-4 py-4 text-center text-sm text-gray-600">
                        <ul class="pl-4">
                            <li th:each="schedule : ${schedules}" th:if="${schedule.dayOfWeek == 7}" th:text="${schedule.startTime} + ' - ' + ${schedule.endTime}"></li>
                        </ul>
                    </td>
                    <td class="px-4 py-4 text-center text-sm text-gray-600">
                        <ul class="pl-4">
                            <li th:each="schedule : ${schedules}" th:if="${schedule.dayOfWeek == 1}" th:text="${schedule.startTime} + ' - ' + ${schedule.endTime}"></li>
                        </ul>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
    <!-- Đánh giá -->
    <div class="bg-white p-6 md:p-8 rounded-xl shadow-lg mx-4 md:mx-8 transform transition duration-300">
        <h2 class="text-2xl font-semibold mb-6 text-indigo-700 flex items-center">
            <i class="fas fa-star mr-2 text-indigo-500"></i> Đánh giá
        </h2>
        <div th:if="${reviews.isEmpty()}" class="text-center text-gray-500 italic">
            Chưa có đánh giá nào.
        </div>

        <div th:each="review : ${reviews}" class="bg-gray-50 p-5 rounded-lg mb-4 shadow-sm border-l-4 border-indigo-100">

            <div class="flex justify-between items-center mb-2">
                <div class="font-semibold text-gray-800 text-lg">
                    <th:block th:if="${review.anonymous}">
                        <i class="fas fa-user-secret mr-2 text-gray-500"></i>
                        Ẩn danh
                    </th:block>
                    <th:block th:if="!${review.anonymous}">
                        <i class="fas fa-user mr-2 text-indigo-500"></i>
                        <span th:text="${review.appointment.patient.fullName}"></span>
                    </th:block>
                </div>

                <p class="text-sm text-gray-500">
                    <i class="far fa-clock mr-1"></i>
                    <span th:text="${#temporals.format(review.createdAt, 'dd/MM/yyyy HH:mm')}"></span>
                </p>
            </div>

            <div class="flex items-center my-2 text-xl text-yellow-400">
                <th:block th:each="i : ${#numbers.sequence(1, 5)}">
                    <i class="fas fa-star"
                       th:classappend="${i > review.rating} ? 'text-gray-300' : ''">
                    </i>
                </th:block>
            </div>

            <p th:text="${review.comment}" class="text-gray-700 mt-3 pl-1 italic">
                Nội dung bình luận...
            </p>
        </div>
    </div>
</section>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
