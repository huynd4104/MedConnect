<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="_csrf" th:content="${_csrf?.token}" sec:authorize="isAuthenticated()"/>
    <meta name="_csrf_header" th:content="${_csrf?.headerName}" sec:authorize="isAuthenticated()"/>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Thêm các style này để header sử dụng gradient
           Vì các class này được định nghĩa trong index.html,
           chúng ta cần chúng ở đây để fragment header hiển thị đúng
           khi được nhúng vào các trang khác. */
        .gradient-text {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            transition: all 0.3s ease;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px -5px rgba(102, 126, 234, 0.4);
        }
    </style>
</head>
<body>

<header th:fragment="header" class="bg-white/95 backdrop-filter backdrop-blur-sm sticky top-0 z-50 w-full border-b border-gray-100 shadow-sm">
    <div class="container mx-auto flex flex-wrap justify-between items-center p-4">
        <a href="/" class="text-3xl font-bold tracking-tight gradient-text">MedConnect</a>

        <nav class="flex flex-col md:flex-row gap-4 md:gap-6 mt-4 md:mt-0 items-center">
            <a href="/" class="text-gray-600 hover:text-purple-600 font-medium transition flex items-center">
                <i class="fas fa-home mr-1.5 text-gray-400"></i> Trang chủ
            </a>
            <a href="/search-doctors" class="text-gray-600 hover:text-purple-600 font-medium transition flex items-center">
                <i class="fas fa-search mr-1.5 text-gray-400"></i> Tìm bác sĩ
            </a>

            <a th:href="@{/patient-dashboard}" sec:authorize="hasRole('Patient')" class="text-gray-600 hover:text-purple-600 font-medium transition flex items-center">
                <i class="fas fa-user mr-1.5 text-gray-400"></i> Bảng điều khiển
            </a>
            <a th:href="@{/doctor-dashboard}" sec:authorize="hasRole('Doctor')" class="text-gray-600 hover:text-purple-600 font-medium transition flex items-center">
                <i class="fas fa-user-md mr-1.5 text-gray-400"></i> Bảng điều khiển
            </a>

            <div sec:authorize="hasRole('Admin')" class="flex flex-col md:flex-row gap-4 md:gap-6">
                <a th:href="@{/admin-doctor-approval}" class="text-gray-600 hover:text-purple-600 font-medium transition flex items-center">
                    <i class="fas fa-check mr-1.5 text-gray-400"></i> Phê duyệt
                </a>
                <a th:href="@{/admin-specializations}" class="text-gray-600 hover:text-purple-600 font-medium transition flex items-center">
                    <i class="fas fa-stethoscope mr-1.5 text-gray-400"></i> Chuyên khoa
                </a>
                <a th:href="@{/admin-doctor-list}" class="text-gray-600 hover:text-purple-600 font-medium transition flex items-center">
                    <i class="fas fa-list mr-1.5 text-gray-400"></i> DS Bác sĩ
                </a>
                <a th:href="@{/admin-patient-list}" class="text-gray-600 hover:text-purple-600 font-medium transition flex items-center">
                    <i class="fas fa-list mr-1.5 text-gray-400"></i> DS Bệnh nhân
                </a>
            </div>

            <div sec:authorize="isAuthenticated()" class="relative flex items-center">
                <button id="notification-bell" class="relative text-gray-500 hover:text-purple-600 transition p-2 rounded-full focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-offset-white focus:ring-indigo-500">
                    <i class="fas fa-bell text-xl"></i>
                    <span id="notification-count"
                          class="absolute top-0 right-0 inline-flex items-center justify-center px-2 py-1 text-xs font-bold leading-none text-red-100 transform translate-x-1/2 -translate-y-1/2 bg-red-600 rounded-full hidden">
                        0 </span>
                </button>
                <div id="notification-dropdown" class="absolute right-0 mt-2 w-80 bg-white rounded-md shadow-lg py-1 z-50 hidden top-full border border-gray-200 max-h-96 overflow-y-auto">
                    <div class="px-4 py-3 border-b flex justify-between items-center">
                        <span class="font-semibold text-gray-800 text-base">Thông báo</span>
                        <button id="mark-all-read-btn" class="text-xs text-indigo-600 hover:underline disabled:text-gray-400 disabled:no-underline" disabled>Đánh dấu tất cả đã đọc</button>
                    </div>
                    <div id="notification-list" class="divide-y divide-gray-100">
                        <div id="no-notifications" class="px-4 py-4 text-sm text-gray-500 text-center">Chưa có thông báo mới.</div>
                    </div>
                </div>
                <button id="enable-notifications-btn" class="ml-4 bg-blue-500 hover:bg-blue-600 text-white px-3 py-1 rounded text-sm whitespace-nowrap hidden">Bật Thông báo</button>
            </div>

            <div class="flex items-center gap-2">
                <form th:action="@{/logout}" method="post" class="inline" sec:authorize="isAuthenticated()">
                    <input type="hidden" th:name="${_csrf?.parameterName}" th:value="${_csrf?.token}"/>
                    <button type="submit" class="text-gray-600 hover:bg-gray-100 px-4 py-2 rounded-xl font-medium transition flex items-center">
                        <i class="fas fa-sign-out-alt mr-2 text-gray-400"></i> Đăng xuất
                    </button>
                </form>

                <a th:href="@{/login}" sec:authorize="!isAuthenticated()" class="text-gray-600 hover:bg-gray-100 px-4 py-2 rounded-xl font-medium transition flex items-center">
                    <i class="fas fa-sign-in-alt mr-2 text-gray-400"></i> Đăng nhập
                </a>
                <a th:href="@{/register}" sec:authorize="!isAuthenticated()" class="btn-primary text-white px-4 py-2 rounded-xl font-medium transition flex items-center shadow-lg">
                    <i class="fas fa-user-plus mr-2"></i> Đăng ký
                </a>
            </div>
        </nav>
    </div>
</header>

<th:block th:fragment="firebase-scripts">
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-messaging-compat.js"></script>

    <script th:inline="javascript" sec:authorize="isAuthenticated()">
        window.csrfToken = /*[[${_csrf?.token}]]*/ null;
        window.csrfHeaderName = /*[[${_csrf?.headerName}]]*/ null;
    </script>
    <script th:src="@{/js/firebase-init.js}" defer></script>
</th:block>

</body>
</html>
