<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Quản lý lịch làm việc - MedConnect</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <th:block th:replace="~{fragments/header :: firebase-scripts}"></th:block>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }

        .gradient-text {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .fc .fc-timegrid-slot {
            height: 3rem;
            font-size: 1rem;
        }
        .fc .fc-col-header-cell {
            background-color: #faf5ff;
            color: #7e22ce;
            font-weight: 600;
            padding: 0.75rem;
            font-size: 1rem;
        }
        .fc .fc-event {
            border-radius: 0.5rem !important;
            font-size: 0.75rem !important;
            padding: 0.25rem 0.5rem !important;
            border: none !important;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            line-height: 1.2;
        }

        .fc .fc-event .fc-event-main {
            color: white !important;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .fc .fc-daygrid-day-number {
            font-size: 0.9rem;
        }
        .fc .fc-toolbar-title {
            font-size: 1.25rem;
            font-weight: 600;
            color: #1f2937;
        }
        .fc .fc-button {
            background-color: #9333ea;
            border: none;
            padding: 0.5rem 1rem;
            font-size: 0.9rem;
            border-radius: 0.75rem;
            transition: all 0.3s ease;
        }
        .fc .fc-button:hover {
            background-color: #7e22ce;
            transform: translateY(-1px);
        }
        .fc .fc-button-primary:not(:disabled).fc-button-active,
        .fc .fc-button-primary:not(:disabled):active {
            background-color: #7e22ce;
        }

        /* Custom styles cho time slot selector */
        .time-slot-btn {
            transition: all 0.2s ease;
        }

        .time-slot-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(147, 51, 234, 0.3);
        }

        .time-slot-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .time-slot-btn.selected {
            background: linear-gradient(135deg, #9333ea 0%, #7e22ce 100%);
            color: white;
            border-color: #7e22ce;
            box-shadow: 0 4px 12px rgba(147, 51, 234, 0.4);
        }

        .time-slot-grid {
            max-height: 400px;
            overflow-y: auto;
            scrollbar-width: thin;
            scrollbar-color: #e5e7eb #f9fafb;
        }

        .time-slot-grid::-webkit-scrollbar {
            width: 6px;
        }

        .time-slot-grid::-webkit-scrollbar-track {
            background: #f9fafb;
            border-radius: 3px;
        }

        .time-slot-grid::-webkit-scrollbar-thumb {
            background: #e5e7eb;
            border-radius: 3px;
        }

        .time-slot-grid::-webkit-scrollbar-thumb:hover {
            background: #d1d5db;
        }

        .slot-counter {
            animation: bounce 0.3s ease;
        }

        @keyframes bounce {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col antialiased">
<div th:replace="~{fragments/header :: header}"></div>

<section class="container mx-auto py-16 px-4 md:px-0">
    <div class="max-w-8xl mx-auto px-5">
        <div th:if="${success}" class="mb-6 p-4 bg-green-50 border border-green-300 text-green-700 rounded-xl text-center text-sm" th:text="${success}"></div>
        <div th:if="${error}" class="mb-6 p-4 bg-red-50 border border-red-300 text-red-700 rounded-xl text-center text-sm" th:text="${error}"></div>
    </div>

    <div class="max-w-8xl mx-auto px-5 grid grid-cols-1 md:grid-cols-10 gap-8">

        <div class="bg-white p-6 md:p-8 rounded-2xl shadow-xl border border-gray-100 col-span-1 md:col-span-7">
            <div id="calendar"></div>
        </div>

        <form th:action="@{/doctor-schedule}" th:object="${scheduleDTO}" method="post"
              class="bg-white p-6 md:p-8 rounded-2xl shadow-xl border border-gray-100 col-span-1 md:col-span-3 space-y-6">

            <h2 class="text-3xl font-semibold mb-4 text-gray-900 flex items-center">
                <i class="fas fa-calendar mr-3 text-purple-600"></i> Thêm Khung Giờ Mới
            </h2>

            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

            <div>
                <label for="dayOfWeekInput" class="block text-sm font-medium text-gray-700 mb-1">Ngày trong tuần</label>
                <select id="dayOfWeekInput" th:field="*{dayOfWeek}"
                        class="w-full p-3 border border-gray-300 rounded-xl focus:ring-1 focus:ring-purple-500 focus:border-purple-500 text-sm">
                    <option value="">-- Chọn ngày --</option>
                    <option value="2">Thứ Hai</option>
                    <option value="3">Thứ Ba</option>
                    <option value="4">Thứ Tư</option>
                    <option value="5">Thứ Năm</option>
                    <option value="6">Thứ Sáu</option>
                    <option value="7">Thứ Bảy</option>
                    <option value="1">Chủ Nhật</option>
                </select>
                <span th:if="${#fields.hasErrors('dayOfWeek')}" th:errors="*{dayOfWeek}" class="text-red-500 text-xs mt-1"></span>
            </div>

            <div>
                <div class="flex items-center justify-between mb-3">
                    <label class="block text-sm font-medium text-gray-700">
                        <i class="fas fa-clock mr-1 text-purple-600"></i>
                        Chọn khung giờ
                    </label>
                    <div class="flex items-center gap-2">
                        <span id="selectedCount" class="slot-counter text-xs font-semibold px-2.5 py-1 bg-purple-100 text-purple-700 rounded-full">
                            0 khung giờ
                        </span>
                        <button type="button" id="clearAllBtn" class="text-xs text-gray-500 hover:text-red-600 transition">
                            <i class="fas fa-times-circle mr-1"></i>Xóa tất cả
                        </button>
                    </div>
                </div>

                <div id="timeSlotsContainer" class="time-slot-grid border border-gray-200 rounded-xl p-4 bg-gray-50">
                    <div class="text-center text-gray-400 py-8">
                        <i class="fas fa-calendar-day text-4xl mb-3"></i>
                        <p class="text-sm">Vui lòng chọn ngày trong tuần trước</p>
                    </div>
                </div>

                <!-- Hidden input để submit slots -->
                <input type="hidden" id="slotsInput" name="slots" th:field="*{slots}">
                <span th:if="${#fields.hasErrors('slots')}" th:errors="*{slots}" class="text-red-500 text-xs mt-1"></span>
            </div>

            <div>
                <label for="consultationTypeInput" class="block text-sm font-medium text-gray-700 mb-1">Loại tư vấn</label>
                <select id="consultationTypeInput" th:field="*{consultationType}"
                        class="w-full p-3 border border-gray-300 rounded-xl focus:ring-1 focus:ring-purple-500 focus:border-purple-500 text-sm">
                    <option value="Online">Trực tuyến (Online)</option>
                    <option value="InPerson">Trực tiếp (In-Person)</option>
                </select>
                <span th:if="${#fields.hasErrors('consultationType')}" th:errors="*{consultationType}" class="text-red-500 text-xs mt-1"></span>
            </div>

            <div class="flex items-center gap-4 pt-2">
                <a th:href="@{/doctor-dashboard}"
                   class="flex-1 bg-gray-300 text-gray-800 p-3 rounded-xl font-semibold text-center hover:bg-gray-400 transition transform hover:-translate-y-1">
                    <i class="fas fa-arrow-left mr-2"></i>Quay Lại
                </a>
                <button type="submit"
                        class="flex-1 bg-purple-600 text-white p-3 rounded-xl font-semibold hover:bg-purple-700 transition transform hover:-translate-y-1 hover:shadow-lg focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-purple-500">
                    Thêm Lịch
                </button>
            </div>

            <div class="bg-white rounded-2xl shadow-xl p-6 border border-gray-100">
                <h3 class="text-lg font-bold text-gray-900 mb-4 flex items-center">
                    <i class="fas fa-info-circle mr-2 text-purple-600"></i>Chú thích
                </h3>
                <div class="space-y-3">
                    <div class="flex items-center">
                        <span class="text-gray-700"><i class="fas fa-video text-purple-600 mr-1"></i>Tư vấn Trực tuyến</span>
                    </div>
                    <div class="flex items-center">
                        <span class="text-gray-700"><i class="fas fa-hospital text-green-600 mr-1"></i>Tư vấn Trực tiếp</span>
                    </div>
                </div>
            </div>
        </form>
    </div>
</section>

<div id="scheduleModal" class="fixed inset-0 bg-gray-600 bg-opacity-50 overflow-y-auto h-full w-full hidden z-50 flex items-center justify-center">
    <div class="relative p-8 bg-white w-full max-w-md m-auto flex-col flex rounded-2xl shadow-lg">
        <div id="viewMode">
            <h3 class="text-2xl font-semibold text-gray-900 text-center mb-4">Chi tiết Khung Giờ</h3>
            <div class="space-y-2 text-center">
                <p id="modal-event-title" class="text-base font-medium text-gray-700"></p>
                <p id="modal-event-time" class="text-sm text-gray-500"></p>
            </div>
            <div class="flex justify-center gap-4 mt-6">
                <button id="editButton" class="px-5 py-2 bg-blue-500 text-white rounded-xl hover:bg-blue-600">Sửa</button>
                <button id="deleteButton" class="px-5 py-2 bg-red-500 text-white rounded-xl hover:bg-red-600">Xóa</button>
                <button id="closeModalButton" class="px-5 py-2 bg-gray-200 text-gray-800 rounded-xl hover:bg-gray-300">Đóng</button>
            </div>
        </div>

        <div id="editMode" class="hidden">
            <h3 class="text-2xl font-semibold text-gray-900 mb-4">Chỉnh Sửa Khung Giờ</h3>
            <form id="editScheduleForm" class="space-y-4">
                <div>
                    <label for="editDayOfWeek" class="block text-sm font-medium text-gray-700">Ngày trong tuần</label>
                    <select id="editDayOfWeek" name="dayOfWeek" class="mt-1 block w-full p-2 border border-gray-300 rounded-xl focus:ring-1 focus:ring-purple-500 focus:border-purple-500 text-sm">
                        <option value="2">Thứ Hai</option>
                        <option value="3">Thứ Ba</option>
                        <option value="4">Thứ Tư</option>
                        <option value="5">Thứ Năm</option>
                        <option value="6">Thứ Sáu</option>
                        <option value="7">Thứ Bảy</option>
                        <option value="1">Chủ Nhật</option>
                    </select>
                </div>

                <div>
                    <label for="editSlotInput" class="block text-sm font-medium text-gray-700">Khung giờ</label>
                    <select id="editSlotInput" name="slot" class="mt-1 block w-full p-2 border border-gray-300 rounded-xl focus:ring-1 focus:ring-purple-500 focus:border-purple-500 text-sm">
                    </select>
                </div>

                <div>
                    <label for="editConsultationType" class="block text-sm font-medium text-gray-700">Loại tư vấn</label>
                    <select id="editConsultationType" name="consultationType" class="mt-1 block w-full p-2 border border-gray-300 rounded-xl focus:ring-1 focus:ring-purple-500 focus:border-purple-500 text-sm">
                        <option value="Online">Tư vấn Online</option>
                        <option value="InPerson">Tư vấn Trực tiếp</option>
                    </select>
                </div>
                <div class="flex justify-end gap-4 mt-4">
                    <button type="submit" class="px-5 py-2 bg-green-500 text-white rounded-xl hover:bg-green-600">Lưu thay đổi</button>
                    <button type="button" id="cancelEditButton" class="px-5 py-2 bg-gray-200 text-gray-800 rounded-xl hover:bg-gray-300">Hủy</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const calendarEl = document.getElementById('calendar');
        const modal = document.getElementById('scheduleModal');
        const viewMode = document.getElementById('viewMode');
        const editMode = document.getElementById('editMode');
        const editForm = document.getElementById('editScheduleForm');
        const closeModalButton = document.getElementById('closeModalButton');
        const deleteButton = document.getElementById('deleteButton');
        const editButton = document.getElementById('editButton');
        const cancelEditButton = document.getElementById('cancelEditButton');
        const csrfToken = document.querySelector('input[name="_csrf"]').value;
        let selectedEvent = null;

        const addDaySelect = document.getElementById('dayOfWeekInput');
        const timeSlotsContainer = document.getElementById('timeSlotsContainer');
        const slotsInput = document.getElementById('slotsInput');
        const selectedCountEl = document.getElementById('selectedCount');
        const clearAllBtn = document.getElementById('clearAllBtn');
        const editSlotSelect = document.getElementById('editSlotInput');
        const editDaySelect = document.getElementById('editDayOfWeek');

        let selectedSlots = new Set();

        const closeModal = () => {
            modal.classList.add('hidden');
            viewMode.classList.remove('hidden');
            editMode.classList.add('hidden');
            selectedEvent = null;
        };

        closeModalButton.addEventListener('click', closeModal);
        cancelEditButton.addEventListener('click', () => {
            viewMode.classList.remove('hidden');
            editMode.classList.add('hidden');
        });
        window.addEventListener('click', (event) => {
            if (event.target === modal) closeModal();
        });
        editButton.addEventListener('click', showEditMode);

        deleteButton.addEventListener('click', () => {
            if (!selectedEvent) return;
            if (confirm('Bạn có chắc chắn muốn xóa khung giờ này không?')) {
                fetch(`/api/schedules/${selectedEvent.id}`, {
                    method: 'DELETE',
                    headers: { 'X-CSRF-TOKEN': csrfToken }
                })
                    .then(response => {
                        if (response.ok) {
                            alert('Xóa thành công!');
                            location.reload();
                        } else {
                            alert('Đã xảy ra lỗi khi xóa.');
                        }
                    })
                    .catch(error => console.error('Error:', error))
                    .finally(closeModal);
            }
        });

        // Update selected count display
        function updateSelectedCount() {
            const count = selectedSlots.size;
            selectedCountEl.textContent = `${count} khung giờ`;
            slotsInput.value = Array.from(selectedSlots).join(',');
        }

        // Clear all selections
        clearAllBtn.addEventListener('click', () => {
            selectedSlots.clear();
            document.querySelectorAll('.time-slot-btn').forEach(btn => {
                btn.classList.remove('selected');
            });
            updateSelectedCount();
        });

        // Load available slots and render as buttons
        async function loadAvailableSlots(day) {
            if (!day) {
                timeSlotsContainer.innerHTML = `
                    <div class="text-center text-gray-400 py-8">
                        <i class="fas fa-calendar-day text-4xl mb-3"></i>
                        <p class="text-sm">Vui lòng chọn ngày trong tuần trước</p>
                    </div>
                `;
                selectedSlots.clear();
                updateSelectedCount();
                return;
            }

            timeSlotsContainer.innerHTML = `
                <div class="text-center text-gray-400 py-8">
                    <i class="fas fa-spinner fa-spin text-3xl mb-3"></i>
                    <p class="text-sm">Đang tải khung giờ...</p>
                </div>
            `;

            try {
                const response = await fetch(`/api/schedules/available?dayOfWeek=${day}`);
                if (!response.ok) throw new Error('Failed to fetch slots');
                const availableSlots = await response.json();

                if (Object.keys(availableSlots).length === 0) {
                    timeSlotsContainer.innerHTML = `
                        <div class="text-center text-gray-400 py-8">
                            <i class="fas fa-calendar-times text-4xl mb-3"></i>
                            <p class="text-sm">Không còn khung giờ trống</p>
                        </div>
                    `;
                    return;
                }

                // Render time slot buttons in a grid
                timeSlotsContainer.innerHTML = `
                    <div class="grid grid-cols-2 gap-2">
                        ${Object.entries(availableSlots).map(([value, text]) => `
                            <button type="button"
                                    class="time-slot-btn px-3 py-2.5 border-2 border-gray-300 rounded-lg text-sm font-medium text-gray-700 bg-white hover:border-purple-400 focus:outline-none focus:ring-2 focus:ring-purple-500 focus:ring-offset-1"
                                    data-slot="${value}">
                                <i class="far fa-clock mr-1 text-xs"></i>
                                ${text}
                            </button>
                        `).join('')}
                    </div>
                `;

                // Add click handlers to slot buttons
                document.querySelectorAll('.time-slot-btn').forEach(btn => {
                    btn.addEventListener('click', function() {
                        const slot = this.dataset.slot;
                        if (selectedSlots.has(slot)) {
                            selectedSlots.delete(slot);
                            this.classList.remove('selected');
                        } else {
                            selectedSlots.add(slot);
                            this.classList.add('selected');
                        }
                        updateSelectedCount();
                    });
                });

            } catch (error) {
                console.error('Error loading slots:', error);
                timeSlotsContainer.innerHTML = `
                    <div class="text-center text-red-400 py-8">
                        <i class="fas fa-exclamation-triangle text-4xl mb-3"></i>
                        <p class="text-sm">Lỗi khi tải khung giờ</p>
                    </div>
                `;
            }
        }

        // Load slots for edit mode (dropdown)
        async function loadAvailableSlotsForEdit(day, selectElement, selectedSlot = null, currentSlotText = null) {
            if (!day) {
                selectElement.innerHTML = '<option value="" disabled>Vui lòng chọn ngày</option>';
                return;
            }
            selectElement.innerHTML = '<option value="" disabled>Đang tải...</option>';

            try {
                const response = await fetch(`/api/schedules/available?dayOfWeek=${day}`);
                if (!response.ok) throw new Error('Failed to fetch slots');
                const availableSlots = await response.json();
                selectElement.innerHTML = '';

                if (selectedSlot && !availableSlots.hasOwnProperty(selectedSlot)) {
                    const option = document.createElement('option');
                    option.value = selectedSlot;
                    option.text = currentSlotText + " (Hiện tại)";
                    option.selected = true;
                    selectElement.appendChild(option);
                }

                for (const [value, text] of Object.entries(availableSlots)) {
                    const option = document.createElement('option');
                    option.value = value;
                    option.text = text;
                    if (value === selectedSlot) option.selected = true;
                    selectElement.appendChild(option);
                }

                if (selectElement.innerHTML === '') {
                    selectElement.innerHTML = '<option value="" disabled>Không còn slot trống</option>';
                }
            } catch (error) {
                console.error('Error loading slots:', error);
                selectElement.innerHTML = '<option value="" disabled>Lỗi khi tải slot</option>';
            }
        }

        // When day changes, load available slots
        addDaySelect.addEventListener('change', () => {
            selectedSlots.clear();
            updateSelectedCount();
            loadAvailableSlots(addDaySelect.value);
        });

        // Edit mode: change day
        editDaySelect.addEventListener('change', () => {
            loadAvailableSlotsForEdit(editDaySelect.value, editSlotSelect);
        });

        function showEditMode() {
            if (!selectedEvent) return;
            const eventData = selectedEvent.extendedProps;
            const currentStartTime = selectedEvent.start.toTimeString().substring(0, 5);
            const currentEndTime = selectedEvent.end.toTimeString().substring(0, 5);
            const currentSlotText = `${currentStartTime} - ${currentEndTime}`;

            document.getElementById('editDayOfWeek').value = eventData.dayOfWeek;
            document.getElementById('editConsultationType').value = eventData.consultationType;
            loadAvailableSlotsForEdit(eventData.dayOfWeek, editSlotSelect, currentStartTime, currentSlotText);

            viewMode.classList.add('hidden');
            editMode.classList.remove('hidden');
        }

        editForm.addEventListener('submit', (e) => {
            e.preventDefault();
            if (!selectedEvent) return;

            const formData = new FormData(editForm);
            const scheduleData = {
                dayOfWeek: parseInt(formData.get('dayOfWeek')),
                consultationType: formData.get('consultationType'),
                slots: [formData.get('slot')]
            };

            fetch(`/api/schedules/${selectedEvent.id}`, {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRF-TOKEN': csrfToken
                },
                body: JSON.stringify(scheduleData)
            })
                .then(response => {
                    if (response.ok) {
                        alert('Cập nhật thành công!');
                        location.reload();
                    } else if (response.status === 409) {
                        alert('Lỗi: Khung giờ mới bị trùng với một lịch đã có.');
                    } else {
                        alert('Đã xảy ra lỗi khi cập nhật.');
                    }
                })
                .catch(error => console.error('Error:', error))
                .finally(closeModal);
        });

        // Load calendar
        fetch('/api/schedules')
            .then(response => response.json())
            .then(data => {
                const calendarEvents = data.map(scheduleDTO => {
                    const startTime = scheduleDTO.slots[0];
                    const timeParts = startTime.split(':').map(Number);
                    const dateObj = new Date();
                    dateObj.setHours(timeParts[0], timeParts[1] + 30, 0, 0);
                    const endTime = dateObj.toTimeString().substring(0, 5);
                    const calendarDay = scheduleDTO.dayOfWeek - 1;

                    return {
                        id: scheduleDTO.scheduleId,
                        title: '',
                        startTime: startTime,
                        endTime: endTime,
                        daysOfWeek: [calendarDay],
                        color: scheduleDTO.consultationType === 'Online' ? '#a855f7' : '#10b981',
                        textColor: '#ffffff',
                        allDay: false,
                        displayEventTime: false,
                        extendedProps: {
                            dayOfWeek: scheduleDTO.dayOfWeek,
                            consultationType: scheduleDTO.consultationType,
                            startTime: startTime,
                            endTime: endTime
                        }
                    };
                });

                const calendar = new FullCalendar.Calendar(calendarEl, {
                    initialView: 'timeGridWeek',
                    locale: 'vi',
                    firstDay: 1,
                    headerToolbar: {
                        left: 'prev,next today',
                        center: 'title',
                        right: 'timeGridWeek,timeGridDay'
                    },
                    slotMinTime: '07:00:00',
                    slotMaxTime: '21:30:00',
                    allDaySlot: false,
                    events: calendarEvents,
                    eventTimeFormat: { hour: '2-digit', minute: '2-digit', hour12: false },
                    eventClick: function(info) {
                        info.jsEvent.preventDefault();
                        selectedEvent = info.event;
                        const isOnline = selectedEvent.extendedProps.consultationType === 'Online';
                        const iconHtml = isOnline
                            ? '<i class="fas fa-video text-purple-600 mr-2"></i>'
                            : '<i class="fas fa-hospital text-green-600 mr-2"></i>';
                        const label = isOnline ? 'Trực tuyến' : 'Trực tiếp';
                        document.getElementById('modal-event-title').innerHTML = iconHtml + label;
                        const startTime = selectedEvent.start.toTimeString().substring(0, 5);
                        const endTime = selectedEvent.end.toTimeString().substring(0, 5);
                        document.getElementById('modal-event-time').innerText = `Thời gian: ${startTime} - ${endTime}`;
                        modal.classList.remove('hidden');
                    },
                    eventContent: function(info) {
                        const props = info.event.extendedProps;
                        const isOnline = props.consultationType === 'Online';
                        const icon = isOnline
                            ? '<i class="fas fa-video text-purple-200 mr-1 text-xs"></i>'
                            : '<i class="fas fa-hospital text-green-200 mr-1 text-xs"></i>';
                        const time = `${props.startTime} - ${info.event.end.toTimeString().substring(0, 5)}`;

                        return {
                            html: `
                                <div class="flex flex-col items-center justify-center h-full text-white text-xs leading-tight">
                                     <div class="text-xs opacity-90">${time}</div>
                                     <div class="flex items-center">
                                        ${icon}
                                     </div>
                                </div>
                            `
                        };
                    },
                });
                calendar.render();
            })
            .catch(error => console.error('Error fetching schedules:', error));
    });
</script>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
