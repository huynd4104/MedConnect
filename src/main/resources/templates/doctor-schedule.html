<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Quản lý lịch làm việc - MedConnect</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <th:block th:replace="~{fragments/header :: firebase-scripts}"></th:block>

    <style>
        .fc .fc-timegrid-slot {
            height: 3rem;
            font-size: 1rem;
        }
        .fc .fc-col-header-cell {
            background-color: #f3f4f6;
            font-weight: 600;
            padding: 0.75rem;
            font-size: 1rem;
        }
        .fc .fc-event {
            border-radius: 0.25rem;
            font-size: 0.85rem;
            padding: 0.25rem 0.5rem;
            border: 1px solid #e5e7eb;
        }
        .fc .fc-event-main {
            color: #1f2937;
        }
        .fc .fc-daygrid-day-number {
            font-size: 0.9rem;
        }
        .fc .fc-toolbar-title {
            font-size: 1.25rem;
            font-weight: 600;
            color: #1f2937;
        }
        .fc .fc-button {
            background-color: #4b5563;
            border: none;
            padding: 0.5rem 1rem;
            font-size: 0.9rem;
        }
        .fc .fc-button:hover {
            background-color: #6b7280;
        }
    </style>
</head>
<body class="bg-gradient-to-r from-blue-50 to-indigo-100 min-h-screen flex flex-col font-sans antialiased">
<div th:replace="~{fragments/header :: header}"></div>

<section class="container mx-auto py-12 px-4 md:px-0">
    <h1 class="text-4xl font-bold mb-8 text-center text-indigo-800 drop-shadow-md">Lịch Làm Việc Của Tôi</h1>

    <!-- Thông báo thành công / lỗi -->
    <div class="max-w-6xl mx-auto">
        <div th:if="${success}" class="mb-6 p-4 bg-green-50 border border-green-300 text-green-700 rounded-md text-center text-sm" th:text="${success}"></div>
        <div th:if="${error}" class="mb-6 p-4 bg-red-50 border border-red-300 text-red-700 rounded-md text-center text-sm" th:text="${error}"></div>
    </div>

    <!-- Grid: Lịch (7 phần) + Form (3 phần) -->
    <div class="max-w-8xl mx-auto px-5 grid grid-cols-1 md:grid-cols-10 gap-4">
        <!-- LỊCH LÀM VIỆC - BÊN TRÁI (7/10) -->
        <div class="bg-white p-6 md:p-8 rounded-xl shadow-lg col-span-1 md:col-span-7">
            <div id="calendar"></div>
        </div>

        <!-- FORM THÊM KHUNG GIỜ - BÊN PHẢI (3/10) -->
        <form th:action="@{/doctor-schedule}" th:object="${scheduleDTO}" method="post"
              class="bg-white p-6 md:p-8 rounded-xl shadow-lg col-span-1 md:col-span-3 space-y-5">

            <h2 class="text-2xl font-semibold mb-6 text-indigo-700 flex items-center">
                <i class="fas fa-calendar mr-2 text-indigo-500"></i> Thêm Khung Giờ Mới
            </h2>

            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

            <!-- Ngày trong tuần -->
            <div>
                <label for="dayOfWeekInput" class="block text-sm font-medium text-gray-600 mb-1">Ngày trong tuần</label>
                <select id="dayOfWeekInput" th:field="*{dayOfWeek}"
                        class="w-full p-2 border border-gray-300 rounded-md focus:ring-1 focus:ring-indigo-400 focus:border-indigo-400 text-sm">
                    <option value="">-- Chọn ngày --</option>
                    <option value="2">Thứ Hai</option>
                    <option value="3">Thứ Ba</option>
                    <option value="4">Thứ Tư</option>
                    <option value="5">Thứ Năm</option>
                    <option value="6">Thứ Sáu</option>
                    <option value="7">Thứ Bảy</option>
                    <option value="1">Chủ Nhật</option>
                </select>
                <span th:if="${#fields.hasErrors('dayOfWeek')}" th:errors="*{dayOfWeek}" class="text-red-500 text-xs mt-1"></span>
            </div>

            <!-- Khung giờ (multiple, click để chọn/bỏ) -->
            <div>
                <label for="slotInput" class="block text-sm font-medium text-gray-600 mb-1">Chọn khung giờ (có thể chọn nhiều)</label>
                <select id="slotInput" th:field="*{slots}" multiple="multiple" size="10"
                        class="w-full p-2 border border-gray-300 rounded-md focus:ring-1 focus:ring-indigo-400 focus:border-indigo-400 text-sm">
                    <option value="" disabled>Vui lòng chọn ngày trong tuần trước</option>
                </select>
                <span th:if="${#fields.hasErrors('slots')}" th:errors="*{slots}" class="text-red-500 text-xs mt-1"></span>
            </div>

            <!-- Loại tư vấn -->
            <div>
                <label for="consultationTypeInput" class="block text-sm font-medium text-gray-600 mb-1">Loại tư vấn</label>
                <select id="consultationTypeInput" th:field="*{consultationType}"
                        class="w-full p-2 border border-gray-300 rounded-md focus:ring-1 focus:ring-indigo-400 focus:border-indigo-400 text-sm">
                    <option value="Online">Trực tuyến (Online)</option>
                    <option value="InPerson">Trực tiếp (In-Person)</option>
                </select>
                <span th:if="${#fields.hasErrors('consultationType')}" th:errors="*{consultationType}" class="text-red-500 text-xs mt-1"></span>
            </div>

            <!-- Nút hành động -->
            <div class="flex items-center gap-4 pt-2">
                <a th:href="@{/doctor-dashboard}"
                   class="flex-1 bg-gray-500 text-white p-3 rounded-lg font-semibold text-center hover:bg-gray-600 transition-colors duration-300">
                    Quay Lại
                </a>
                <button type="submit"
                        class="flex-1 bg-indigo-600 text-white p-3 rounded-lg font-semibold hover:bg-indigo-700 transition-colors duration-300 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">
                    Thêm Lịch
                </button>
            </div>

            <!-- Legend -->
            <div class="bg-white rounded-2xl shadow-xl p-6 border border-gray-100">
                <h3 class="text-lg font-bold text-gray-800 mb-4 flex items-center">
                    <i class="fas fa-info-circle mr-2 text-indigo-500"></i>Chú thích
                </h3>
                <div class="space-y-3">
                    <div class="flex items-center">
                        <div class="w-4 h-4 bg-blue-500 rounded mr-3 shadow-sm"></div>
                        <span class="text-sm text-gray-700">Tư vấn Online</span>
                    </div>
                    <div class="flex items-center">
                        <div class="w-4 h-4 bg-green-500 rounded mr-3 shadow-sm"></div>
                        <span class="text-sm text-gray-700">Tư vấn Trực tiếp</span>
                    </div>
                </div>
            </div>
        </form>
    </div>
</section>

<!-- Modal chi tiết & sửa -->
<div id="scheduleModal" class="fixed inset-0 bg-gray-600 bg-opacity-50 overflow-y-auto h-full w-full hidden z-50 flex items-center justify-center">
    <div class="relative p-8 bg-white w-full max-w-md m-auto flex-col flex rounded-lg shadow-lg">
        <!-- Xem chi tiết -->
        <div id="viewMode">
            <h3 class="text-2xl font-semibold text-gray-800 text-center mb-4">Chi tiết Khung Giờ</h3>
            <div class="space-y-2 text-center">
                <p id="modal-event-title" class="text-base font-medium text-gray-700"></p>
                <p id="modal-event-time" class="text-sm text-gray-500"></p>
            </div>
            <div class="flex justify-center gap-4 mt-6">
                <button id="editButton" class="px-5 py-2 bg-blue-500 text-white rounded-lg hover:bg-blue-600">Sửa</button>
                <button id="deleteButton" class="px-5 py-2 bg-red-500 text-white rounded-lg hover:bg-red-600">Xóa</button>
                <button id="closeModalButton" class="px-5 py-2 bg-gray-200 text-gray-800 rounded-lg hover:bg-gray-300">Đóng</button>
            </div>
        </div>

        <!-- Sửa khung giờ -->
        <div id="editMode" class="hidden">
            <h3 class="text-2xl font-semibold text-gray-800 mb-4">Chỉnh Sửa Khung Giờ</h3>
            <form id="editScheduleForm" class="space-y-4">
                <div>
                    <label for="editDayOfWeek" class="block text-sm font-medium text-gray-700">Ngày trong tuần</label>
                    <select id="editDayOfWeek" name="dayOfWeek" class="mt-1 block w-full p-2 border border-gray-300 rounded-md focus:ring-1 focus:ring-indigo-400 focus:border-indigo-400 text-sm">
                        <option value="2">Thứ Hai</option>
                        <option value="3">Thứ Ba</option>
                        <option value="4">Thứ Tư</option>
                        <option value="5">Thứ Năm</option>
                        <option value="6">Thứ Sáu</option>
                        <option value="7">Thứ Bảy</option>
                        <option value="1">Chủ Nhật</option>
                    </select>
                </div>

                <div>
                    <label for="editSlotInput" class="block text-sm font-medium text-gray-700">Khung giờ</label>
                    <select id="editSlotInput" name="slot" class="mt-1 block w-full p-2 border border-gray-300 rounded-md focus:ring-1 focus:ring-indigo-400 focus:border-indigo-400 text-sm">
                    </select>
                </div>

                <div>
                    <label for="editConsultationType" class="block text-sm font-medium text-gray-700">Loại tư vấn</label>
                    <select id="editConsultationType" name="consultationType" class="mt-1 block w-full p-2 border border-gray-300 rounded-md focus:ring-1 focus:ring-indigo-400 focus:border-indigo-400 text-sm">
                        <option value="Online">Tư vấn Online</option>
                        <option value="InPerson">Tư vấn Trực tiếp</option>
                    </select>
                </div>
                <div class="flex justify-end gap-4 mt-4">
                    <button type="submit" class="px-5 py-2 bg-green-500 text-white rounded-lg hover:bg-green-600">Lưu thay đổi</button>
                    <button type="button" id="cancelEditButton" class="px-5 py-2 bg-gray-200 text-gray-800 rounded-lg hover:bg-gray-300">Hủy</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const calendarEl = document.getElementById('calendar');
        const modal = document.getElementById('scheduleModal');
        const viewMode = document.getElementById('viewMode');
        const editMode = document.getElementById('editMode');
        const editForm = document.getElementById('editScheduleForm');
        const closeModalButton = document.getElementById('closeModalButton');
        const deleteButton = document.getElementById('deleteButton');
        const editButton = document.getElementById('editButton');
        const cancelEditButton = document.getElementById('cancelEditButton');
        const csrfToken = document.querySelector('input[name="_csrf"]').value;
        let selectedEvent = null;

        const addDaySelect = document.getElementById('dayOfWeekInput');
        const addSlotSelect = document.getElementById('slotInput');
        const editSlotSelect = document.getElementById('editSlotInput');
        const editDaySelect = document.getElementById('editDayOfWeek');

        const closeModal = () => {
            modal.classList.add('hidden');
            viewMode.classList.remove('hidden');
            editMode.classList.add('hidden');
            selectedEvent = null;
        };

        closeModalButton.addEventListener('click', closeModal);
        cancelEditButton.addEventListener('click', () => {
            viewMode.classList.remove('hidden');
            editMode.classList.add('hidden');
        });
        window.addEventListener('click', (event) => {
            if (event.target === modal) closeModal();
        });
        editButton.addEventListener('click', showEditMode);

        deleteButton.addEventListener('click', () => {
            if (!selectedEvent) return;
            if (confirm('Bạn có chắc chắn muốn xóa khung giờ này không?')) {
                fetch(`/api/schedules/${selectedEvent.id}`, {
                    method: 'DELETE',
                    headers: { 'X-CSRF-TOKEN': csrfToken }
                })
                    .then(response => {
                        if (response.ok) {
                            alert('Xóa thành công!');
                            location.reload();
                        } else {
                            alert('Đã xảy ra lỗi khi xóa.');
                        }
                    })
                    .catch(error => console.error('Error:', error))
                    .finally(closeModal);
            }
        });

        // TẢI SLOT CÒN TRỐNG
        async function loadAvailableSlots(day, selectElement, selectedSlot = null, currentSlotText = null) {
            if (!day) {
                selectElement.innerHTML = '<option value="" disabled>Vui lòng chọn ngày</option>';
                return;
            }
            selectElement.innerHTML = '<option value="" disabled>Đang tải...</option>';

            try {
                const response = await fetch(`/api/schedules/available?dayOfWeek=${day}`);
                if (!response.ok) throw new Error('Failed to fetch slots');
                const availableSlots = await response.json();
                selectElement.innerHTML = '';

                if (selectedSlot && !availableSlots.hasOwnProperty(selectedSlot)) {
                    const option = document.createElement('option');
                    option.value = selectedSlot;
                    option.text = currentSlotText + " (Hiện tại)";
                    option.selected = true;
                    selectElement.appendChild(option);
                }

                for (const [value, text] of Object.entries(availableSlots)) {
                    const option = document.createElement('option');
                    option.value = value;
                    option.text = text;
                    if (value === selectedSlot) option.selected = true;
                    selectElement.appendChild(option);
                }

                if (selectElement.innerHTML === '') {
                    selectElement.innerHTML = '<option value="" disabled>Không còn slot trống</option>';
                }
            } catch (error) {
                console.error('Error loading slots:', error);
                selectElement.innerHTML = '<option value="" disabled>Lỗi khi tải slot</option>';
            }
        }

        // KHI CHỌN NGÀY → TẢI SLOT
        addDaySelect.addEventListener('change', () => {
            loadAvailableSlots(addDaySelect.value, addSlotSelect);
        });

        // CLICK ĐỂ CHỌN/BỎ CHỌN SLOT (KHÔNG CẦN SHIFT)
        addSlotSelect.addEventListener('mousedown', function(e) {
            if (e.target.tagName === 'OPTION') {
                e.preventDefault();
                e.stopPropagation();
                const option = e.target;
                option.selected = !option.selected;
                addSlotSelect.focus();
            }
        });

        // SỬA: ĐỔI NGÀY TRONG MODAL
        editDaySelect.addEventListener('change', () => {
            loadAvailableSlots(editDaySelect.value, editSlotSelect);
        });

        function showEditMode() {
            if (!selectedEvent) return;
            const eventData = selectedEvent.extendedProps;
            const currentStartTime = selectedEvent.start.toTimeString().substring(0, 5);
            const currentEndTime = selectedEvent.end.toTimeString().substring(0, 5);
            const currentSlotText = `${currentStartTime} - ${currentEndTime}`;

            document.getElementById('editDayOfWeek').value = eventData.dayOfWeek;
            document.getElementById('editConsultationType').value = eventData.consultationType;
            loadAvailableSlots(eventData.dayOfWeek, editSlotSelect, currentStartTime, currentSlotText);

            viewMode.classList.add('hidden');
            editMode.classList.remove('hidden');
        }

        editForm.addEventListener('submit', (e) => {
            e.preventDefault();
            if (!selectedEvent) return;

            const formData = new FormData(editForm);
            const scheduleData = {
                dayOfWeek: parseInt(formData.get('dayOfWeek')),
                consultationType: formData.get('consultationType'),
                slots: [formData.get('slot')]
            };

            fetch(`/api/schedules/${selectedEvent.id}`, {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRF-TOKEN': csrfToken
                },
                body: JSON.stringify(scheduleData)
            })
                .then(response => {
                    if (response.ok) {
                        alert('Cập nhật thành công!');
                        location.reload();
                    } else if (response.status === 409) {
                        alert('Lỗi: Khung giờ mới bị trùng với một lịch đã có.');
                    } else {
                        alert('Đã xảy ra lỗi khi cập nhật.');
                    }
                })
                .catch(error => console.error('Error:', error))
                .finally(closeModal);
        });

        // TẢI LỊCH TỪ API
        fetch('/api/schedules')
            .then(response => response.json())
            .then(data => {
                const calendarEvents = data.map(scheduleDTO => {
                    const startTime = scheduleDTO.slots[0];
                    const timeParts = startTime.split(':').map(Number);
                    const dateObj = new Date();
                    dateObj.setHours(timeParts[0], timeParts[1] + 30, 0, 0);
                    const endTime = dateObj.toTimeString().substring(0, 5);
                    const calendarDay = scheduleDTO.dayOfWeek - 1;

                    return {
                        id: scheduleDTO.scheduleId,
                        title: scheduleDTO.consultationType === 'Online' ? 'Tư vấn Online' : 'Tư vấn Trực tiếp',
                        startTime: startTime,
                        endTime: endTime,
                        daysOfWeek: [calendarDay],
                        color: scheduleDTO.consultationType === 'Online' ? '#3b82f6' : '#10b981',
                        allDay: false,
                        extendedProps: {
                            dayOfWeek: scheduleDTO.dayOfWeek,
                            consultationType: scheduleDTO.consultationType
                        }
                    };
                });

                const calendar = new FullCalendar.Calendar(calendarEl, {
                    initialView: 'timeGridWeek',
                    locale: 'vi',
                    firstDay: 1,
                    headerToolbar: {
                        left: 'prev,next today',
                        center: 'title',
                        right: 'timeGridWeek,timeGridDay'
                    },
                    slotMinTime: '07:00:00',
                    slotMaxTime: '21:30:00',
                    allDaySlot: false,
                    events: calendarEvents,
                    eventTimeFormat: { hour: '2-digit', minute: '2-digit', hour12: false },
                    eventClick: function(info) {
                        info.jsEvent.preventDefault();
                        selectedEvent = info.event;
                        document.getElementById('modal-event-title').innerText = selectedEvent.title;
                        const startTime = selectedEvent.start.toTimeString().substring(0, 5);
                        const endTime = selectedEvent.end.toTimeString().substring(0, 5);
                        document.getElementById('modal-event-time').innerText = `Thời gian: ${startTime} - ${endTime}`;
                        modal.classList.remove('hidden');
                    }
                });
                calendar.render();
            })
            .catch(error => console.error('Error fetching schedules:', error));
    });
</script>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
