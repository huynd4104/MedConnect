<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Đặt lịch hẹn - MedConnect</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <th:block th:replace="~{fragments/header :: firebase-scripts}"></th:block>

    <style>
        /* Import font giống patient-dashboard.html */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }

        /* Gradient text giống patient-dashboard.html */
        .gradient-text {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* Tùy chỉnh cho bảng trong card (giống patient-dashboard.html) */
        .card-table-container {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            border-radius: 1rem; /* rounded-xl (do đã có shadow-sm) */
            border: 1px solid rgba(0, 0, 0, 0.05);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            overflow: hidden; /* Giúp bo góc cho table header */
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col antialiased">
<div th:replace="~{fragments/header :: header}"></div>

<section class="container mx-auto py-16 px-4 md:px-0">

    <div id="errorMessage" th:if="${error}" class="mt-4 p-4 bg-red-100 border border-red-400 text-red-700 rounded-xl mx-4 md:mx-8 text-center" th:text="${error}"></div>
    <div id="jsErrorContainer" class="mx-4 md:mx-8"></div>


    <div class="grid md:grid-cols-10 gap-8 mx-4 md:mx-8">
        <div class="col-span-full md:col-span-7 bg-white p-6 md:p-8 rounded-2xl shadow-xl border border-gray-100 flex flex-col gap-6">
            <div class="flex flex-col gap-4">
                <h2 class="text-3xl font-semibold text-gray-900 flex items-center">
                    <i class="fas fa-user-md mr-3 text-purple-600"></i> Thông tin bác sĩ
                </h2>
                <div class="space-y-2 p-4 bg-purple-50 rounded-lg border border-purple-200">
                    <p class="text-gray-700"><span class="font-medium">Bác sĩ:</span> <span th:text="${doctor.fullName}"></span></p>
                    <p class="text-gray-700"><span class="font-medium">Chuyên khoa:</span> <span th:text="${doctor.specialization.name}"></span></p>
                </div>
            </div>

            <div class="flex flex-col gap-4">
                <h3 class="text-xl font-semibold text-gray-800 flex items-center">
                    <i class="fas fa-calendar-check mr-2 text-purple-600"></i> Lịch làm việc
                </h3>

                <div class="card-table-container max-h-96 overflow-y-auto">
                    <table class="min-w-full divide-y divide-gray-200">
                        <thead class="bg-gradient-to-r from-purple-50 to-indigo-50 sticky top-0 z-10 shadow-sm">
                        <tr>
                            <th scope="col" class="px-3 py-4 text-center text-xs font-semibold text-purple-700 uppercase tracking-wider border-r border-purple-100">
                                <div class="flex flex-col items-center gap-1">
                                    <i class="fas fa-calendar-day text-purple-500"></i>
                                    <span>Thứ 2</span>
                                </div>
                            </th>
                            <th scope="col" class="px-3 py-4 text-center text-xs font-semibold text-purple-700 uppercase tracking-wider border-r border-purple-100">
                                <div class="flex flex-col items-center gap-1">
                                    <i class="fas fa-calendar-day text-purple-500"></i>
                                    <span>Thứ 3</span>
                                </div>
                            </th>
                            <th scope="col" class="px-3 py-4 text-center text-xs font-semibold text-purple-700 uppercase tracking-wider border-r border-purple-100">
                                <div class="flex flex-col items-center gap-1">
                                    <i class="fas fa-calendar-day text-purple-500"></i>
                                    <span>Thứ 4</span>
                                </div>
                            </th>
                            <th scope="col" class="px-3 py-4 text-center text-xs font-semibold text-purple-700 uppercase tracking-wider border-r border-purple-100">
                                <div class="flex flex-col items-center gap-1">
                                    <i class="fas fa-calendar-day text-purple-500"></i>
                                    <span>Thứ 5</span>
                                </div>
                            </th>
                            <th scope="col" class="px-3 py-4 text-center text-xs font-semibold text-purple-700 uppercase tracking-wider border-r border-purple-100">
                                <div class="flex flex-col items-center gap-1">
                                    <i class="fas fa-calendar-day text-purple-500"></i>
                                    <span>Thứ 6</span>
                                </div>
                            </th>
                            <th scope="col" class="px-3 py-4 text-center text-xs font-semibold text-purple-700 uppercase tracking-wider border-r border-purple-100">
                                <div class="flex flex-col items-center gap-1">
                                    <i class="fas fa-calendar-day text-purple-500"></i>
                                    <span>Thứ 7</span>
                                </div>
                            </th>
                            <th scope="col" class="px-3 py-4 text-center text-xs font-semibold text-purple-700 uppercase tracking-wider">
                                <div class="flex flex-col items-center gap-1">
                                    <i class="fas fa-calendar-day text-red-500"></i>
                                    <span>CN</span>
                                </div>
                            </th>
                        </tr>
                        </thead>
                        <tbody class="bg-white divide-y divide-gray-200">
                        <tr class="transition duration-200">
                            <!-- Thứ 2 -->
                            <td class="px-3 py-4 text-center align-top border-r border-gray-100">
                                <ul class="space-y-2">
                                    <li th:each="schedule : ${schedules}" th:if="${schedule.dayOfWeek == 2}"
                                        class="text-xs font-medium px-2 py-1.5 rounded-lg transition-all hover:shadow-md"
                                        th:classappend="${schedule.consultationType.name() == 'Online'} ? 'bg-purple-50 text-purple-700 border border-purple-200 hover:bg-purple-100' : 'bg-green-50 text-green-700 border border-green-200 hover:bg-green-100'">
                                        <div class="flex flex-col gap-0.5">
                                            <i th:classappend="${schedule.consultationType.name() == 'Online'} ? 'fas fa-video text-purple-500' : 'fas fa-hospital text-green-500'" class="text-[10px]"></i>
                                            <span th:text="${schedule.startTime} + ' - ' + ${schedule.endTime}"></span>
                                        </div>
                                    </li>
                                </ul>
                                <div th:if="${#lists.isEmpty(schedules.?[dayOfWeek == 2])}" class="text-xs text-gray-400 italic py-2">Không có lịch</div>
                            </td>

                            <!-- Thứ 3 -->
                            <td class="px-3 py-4 text-center align-top border-r border-gray-100">
                                <ul class="space-y-2">
                                    <li th:each="schedule : ${schedules}" th:if="${schedule.dayOfWeek == 3}"
                                        class="text-xs font-medium px-2 py-1.5 rounded-lg transition-all hover:shadow-md"
                                        th:classappend="${schedule.consultationType.name() == 'Online'} ? 'bg-purple-50 text-purple-700 border border-purple-200 hover:bg-purple-100' : 'bg-green-50 text-green-700 border border-green-200 hover:bg-green-100'">
                                        <div class="flex flex-col gap-0.5">
                                            <i th:classappend="${schedule.consultationType.name() == 'Online'} ? 'fas fa-video text-purple-500' : 'fas fa-hospital text-green-500'" class="text-[10px]"></i>
                                            <span th:text="${schedule.startTime} + ' - ' + ${schedule.endTime}"></span>
                                        </div>
                                    </li>
                                </ul>
                                <div th:if="${#lists.isEmpty(schedules.?[dayOfWeek == 3])}" class="text-xs text-gray-400 italic py-2">Không có lịch</div>
                            </td>

                            <!-- Thứ 4 -->
                            <td class="px-3 py-4 text-center align-top border-r border-gray-100">
                                <ul class="space-y-2">
                                    <li th:each="schedule : ${schedules}" th:if="${schedule.dayOfWeek == 4}"
                                        class="text-xs font-medium px-2 py-1.5 rounded-lg transition-all hover:shadow-md"
                                        th:classappend="${schedule.consultationType.name() == 'Online'} ? 'bg-purple-50 text-purple-700 border border-purple-200 hover:bg-purple-100' : 'bg-green-50 text-green-700 border border-green-200 hover:bg-green-100'">
                                        <div class="flex flex-col gap-0.5">
                                            <i th:classappend="${schedule.consultationType.name() == 'Online'} ? 'fas fa-video text-purple-500' : 'fas fa-hospital text-green-500'" class="text-[10px]"></i>
                                            <span th:text="${schedule.startTime} + ' - ' + ${schedule.endTime}"></span>
                                        </div>
                                    </li>
                                </ul>
                                <div th:if="${#lists.isEmpty(schedules.?[dayOfWeek == 4])}" class="text-xs text-gray-400 italic py-2">Không có lịch</div>
                            </td>

                            <!-- Thứ 5 -->
                            <td class="px-3 py-4 text-center align-top border-r border-gray-100">
                                <ul class="space-y-2">
                                    <li th:each="schedule : ${schedules}" th:if="${schedule.dayOfWeek == 5}"
                                        class="text-xs font-medium px-2 py-1.5 rounded-lg transition-all hover:shadow-md"
                                        th:classappend="${schedule.consultationType.name() == 'Online'} ? 'bg-purple-50 text-purple-700 border border-purple-200 hover:bg-purple-100' : 'bg-green-50 text-green-700 border border-green-200 hover:bg-green-100'">
                                        <div class="flex flex-col gap-0.5">
                                            <i th:classappend="${schedule.consultationType.name() == 'Online'} ? 'fas fa-video text-purple-500' : 'fas fa-hospital text-green-500'" class="text-[10px]"></i>
                                            <span th:text="${schedule.startTime} + ' - ' + ${schedule.endTime}"></span>
                                        </div>
                                    </li>
                                </ul>
                                <div th:if="${#lists.isEmpty(schedules.?[dayOfWeek == 5])}" class="text-xs text-gray-400 italic py-2">Không có lịch</div>
                            </td>

                            <!-- Thứ 6 -->
                            <td class="px-3 py-4 text-center align-top border-r border-gray-100">
                                <ul class="space-y-2">
                                    <li th:each="schedule : ${schedules}" th:if="${schedule.dayOfWeek == 6}"
                                        class="text-xs font-medium px-2 py-1.5 rounded-lg transition-all hover:shadow-md"
                                        th:classappend="${schedule.consultationType.name() == 'Online'} ? 'bg-purple-50 text-purple-700 border border-purple-200 hover:bg-purple-100' : 'bg-green-50 text-green-700 border border-green-200 hover:bg-green-100'">
                                        <div class="flex flex-col gap-0.5">
                                            <i th:classappend="${schedule.consultationType.name() == 'Online'} ? 'fas fa-video text-purple-500' : 'fas fa-hospital text-green-500'" class="text-[10px]"></i>
                                            <span th:text="${schedule.startTime} + ' - ' + ${schedule.endTime}"></span>
                                        </div>
                                    </li>
                                </ul>
                                <div th:if="${#lists.isEmpty(schedules.?[dayOfWeek == 6])}" class="text-xs text-gray-400 italic py-2">Không có lịch</div>
                            </td>

                            <!-- Thứ 7 -->
                            <td class="px-3 py-4 text-center align-top border-r border-gray-100">
                                <ul class="space-y-2">
                                    <li th:each="schedule : ${schedules}" th:if="${schedule.dayOfWeek == 7}"
                                        class="text-xs font-medium px-2 py-1.5 rounded-lg transition-all hover:shadow-md"
                                        th:classappend="${schedule.consultationType.name() == 'Online'} ? 'bg-purple-50 text-purple-700 border border-purple-200 hover:bg-purple-100' : 'bg-green-50 text-green-700 border border-green-200 hover:bg-green-100'">
                                        <div class="flex flex-col gap-0.5">
                                            <i th:classappend="${schedule.consultationType.name() == 'Online'} ? 'fas fa-video text-purple-500' : 'fas fa-hospital text-green-500'" class="text-[10px]"></i>
                                            <span th:text="${schedule.startTime} + ' - ' + ${schedule.endTime}"></span>
                                        </div>
                                    </li>
                                </ul>
                                <div th:if="${#lists.isEmpty(schedules.?[dayOfWeek == 7])}" class="text-xs text-gray-400 italic py-2">Không có lịch</div>
                            </td>

                            <!-- Chủ Nhật -->
                            <td class="px-3 py-4 text-center align-top">
                                <ul class="space-y-2">
                                    <li th:each="schedule : ${schedules}" th:if="${schedule.dayOfWeek == 1}"
                                        class="text-xs font-medium px-2 py-1.5 rounded-lg transition-all hover:shadow-md"
                                        th:classappend="${schedule.consultationType.name() == 'Online'} ? 'bg-purple-50 text-purple-700 border border-purple-200 hover:bg-purple-100' : 'bg-green-50 text-green-700 border border-green-200 hover:bg-green-100'">
                                        <div class="flex flex-col gap-0.5">
                                            <i th:classappend="${schedule.consultationType.name() == 'Online'} ? 'fas fa-video text-purple-500' : 'fas fa-hospital text-green-500'" class="text-[10px]"></i>
                                            <span th:text="${schedule.startTime} + ' - ' + ${schedule.endTime}"></span>
                                        </div>
                                    </li>
                                </ul>
                                <div th:if="${#lists.isEmpty(schedules.?[dayOfWeek == 1])}" class="text-xs text-gray-400 italic py-2">Không có lịch</div>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>

                <!-- Legend - Chú thích -->
                <div class="flex flex-wrap gap-4 justify-center items-center p-3 bg-gray-50 rounded-lg border border-gray-200">
                    <div class="flex items-center gap-2 text-sm">
                        <div class="w-3 h-3 bg-purple-500 rounded-full"></div>
                        <span class="text-gray-700"><i class="fas fa-video text-purple-600 mr-1"></i>Trực tuyến</span>
                    </div>
                    <div class="flex items-center gap-2 text-sm">
                        <div class="w-3 h-3 bg-green-500 rounded-full"></div>
                        <span class="text-gray-700"><i class="fas fa-hospital text-green-600 mr-1"></i>Trực tiếp</span>
                    </div>
                </div>
            </div>
        </div>

        <div class="col-span-full md:col-span-3 bg-white p-6 md:p-8 rounded-2xl shadow-xl border border-gray-100">
            <h2 class="text-3xl font-semibold mb-6 text-gray-900 flex items-center">
                <i class="fas fa-calendar-plus mr-3 text-purple-600"></i> Thông tin lịch hẹn
            </h2>

            <form th:action="@{/book-appointment}" th:object="${appointmentDTO}" method="post" class="space-y-4">
                <input type="hidden" th:field="*{doctorId}" id="doctorId" />

                <div>
                    <label for="consultationType" class="block text-sm font-medium text-gray-700">Loại tư vấn</label>
                    <select th:field="*{consultationType}" id="consultationType" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-purple-500 focus:border-purple-500">
                        <option value="">-- Chọn loại tư vấn --</option>
                        <option value="InPerson">Trực tiếp</option>
                        <option value="Online">Trực tuyến</option>
                    </select>
                    <span th:if="${#fields.hasErrors('consultationType')}" th:errors="*{consultationType}" class="text-red-500 text-sm"></span>
                </div>

                <div>
                    <label for="appointmentDate" class="block text-sm font-medium text-gray-700">Chọn ngày</label>
                    <input type="date" th:field="*{appointmentDate}" id="appointmentDate" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-purple-500 focus:border-purple-500">
                    <span th:if="${#fields.hasErrors('appointmentDate')}" th:errors="*{appointmentDate}" class="text-red-500 text-sm"></span>
                </div>

                <div>
                    <label for="appointmentTime" class="block text-sm font-medium text-gray-700">Chọn khung giờ</label>
                    <select th:field="*{appointmentTime}" id="appointmentTime" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-purple-500 focus:border-purple-500" disabled>
                        <option value="">-- Vui lòng chọn loại tư vấn và ngày --</option>
                    </select>
                    <span th:if="${#fields.hasErrors('appointmentTime')}" th:errors="*{appointmentTime}" class="text-red-500 text-sm"></span>
                </div>

                <div>
                    <label for="medicalInfo" class="block text-sm font-medium text-gray-700">Thông tin y tế (tùy chọn)</label>
                    <textarea th:field="*{medicalInfo}" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-purple-500 focus:border-purple-500" rows="4"></textarea>
                </div>

                <div class="flex gap-4 pt-4">
                    <a th:href="@{/doctor-profile-view/{id}(id=${doctor.doctorId})}" class="w-1/2 bg-gray-300 text-gray-800 p-3 rounded-xl font-semibold hover:bg-gray-400 transition flex items-center justify-center text-center">
                        <i class="fas fa-arrow-left mr-2"></i> Quay lại
                    </a>
                    <button type="submit" class="w-1/2 bg-purple-600 text-white p-3 rounded-xl font-semibold hover:bg-purple-700 transition flex items-center justify-center">
                        <i class="fas fa-check mr-2"></i> Xác nhận
                    </button>
                </div>
            </form>
        </div>
    </div>
</section>

<div th:replace="~{fragments/footer :: footer}"></div>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const consultationTypeSelect = document.getElementById('consultationType');
        const dateInput = document.getElementById('appointmentDate');
        const slotSelect = document.getElementById('appointmentTime');
        const doctorId = document.getElementById('doctorId').value;
        const jsErrorContainer = document.getElementById('jsErrorContainer');
        const existingError = document.getElementById('errorMessage');

        // Hàm hiển thị lỗi (sử dụng rounded-xl cho đồng bộ)
        function showError(message) {
            // Xóa lỗi cũ (nếu có)
            if (existingError) {
                existingError.style.display = 'none';
            }
            jsErrorContainer.innerHTML = `<div class="mt-4 p-4 bg-red-100 border border-red-400 text-red-700 rounded-xl text-center">${message}</div>`;
        }

        // Hàm xóa lỗi
        function clearError() {
            jsErrorContainer.innerHTML = '';
        }

        // Hàm gọi API
        async function fetchAvailableSlots() {
            clearError();
            const type = consultationTypeSelect.value;
            const date = dateInput.value;

            // Nếu chưa chọn 1 trong 2, thì vô hiệu hóa
            if (!type || !date) {
                slotSelect.innerHTML = '<option value="">-- Vui lòng chọn loại tư vấn và ngày --</option>';
                slotSelect.disabled = true;
                return;
            }

            // Đặt ngày tối thiểu là hôm nay
            const today = new Date().toISOString().split('T')[0];
            if (date < today) {
                showError('Không thể đặt lịch cho ngày trong quá khứ.');
                slotSelect.innerHTML = '<option value="">-- Ngày không hợp lệ --</option>';
                slotSelect.disabled = true;
                return;
            }

            slotSelect.innerHTML = '<option value="">Đang tải slot...</option>';
            slotSelect.disabled = true;

            try {
                const response = await fetch(`/api/appointments/available-slots?doctorId=${doctorId}&date=${date}&type=${type}`);

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.error || 'Lỗi khi tải danh sách slot.');
                }

                const slots = await response.json(); // Đây là Map<"HH:mm", "HH:mm - HH:mm">

                slotSelect.innerHTML = ''; // Xóa sạch

                const keys = Object.keys(slots);

                if (keys.length === 0) {
                    slotSelect.innerHTML = '<option value="">-- Không có slot trống cho ngày này --</option>';
                    slotSelect.disabled = true;
                } else {
                    slotSelect.innerHTML = '<option value="">-- Chọn một khung giờ --</option>';
                    for (const [key, value] of Object.entries(slots)) {
                        const option = document.createElement('option');
                        option.value = key; // "HH:mm"
                        option.textContent = value; // "HH:mm - HH:mm"
                        slotSelect.appendChild(option);
                    }
                    slotSelect.disabled = false;
                }

            } catch (error) {
                console.error('Lỗi khi fetch slot:', error);
                showError('Lỗi khi tải danh sách slot. Vui lòng thử lại.');
                slotSelect.innerHTML = '<option value="">-- Lỗi khi tải slot --</option>';
                slotSelect.disabled = true;
            }
        }

        // Gắn sự kiện
        consultationTypeSelect.addEventListener('change', fetchAvailableSlots);
        dateInput.addEventListener('change', fetchAvailableSlots);

        // Đặt ngày tối thiểu cho input date
        dateInput.setAttribute('min', new Date().toISOString().split('T')[0]);
    });
</script>

</body>
</html>
