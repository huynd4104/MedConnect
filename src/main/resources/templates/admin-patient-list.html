<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Danh sách Bệnh nhân - Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-r from-blue-100 to-indigo-100 min-h-screen flex flex-col">
<div th:replace="~{fragments/header :: header}"></div>

<section class="container mx-auto py-12">
    <h1 class="text-3xl font-bold mb-6 text-center">Quản lý Danh sách Bệnh nhân</h1>
    <div class="bg-white rounded-lg shadow-md overflow-hidden">
        <table class="w-full">
            <thead class="bg-gray-200">
            <tr>
                <th class="p-4 text-left">Họ và Tên</th>
                <th class="p-4 text-left">Email</th>
                <th class="p-4 text-left">Số điện thoại</th>
                <th class="p-4 text-left">Địa chỉ</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="patient : ${patients}" class="hover:bg-gray-100 border-b">
                <td class="p-4" th:text="${patient.fullName}"></td>
                <td class="p-4" th:text="${patient.user.email}"></td>
                <td class="p-4" th:text="${patient.phoneNumber}"></td>
                <td class="p-4" th:text="${patient.address}"></td>
            </tr>
            <tr th:if="${#lists.isEmpty(patients)}">
                <td colspan="4" class="p-4 text-center text-gray-500">Không có bệnh nhân nào trong hệ thống.</td>
            </tr>
            </tbody>
        </table>
    </div>
</section>
</body>
</html>
