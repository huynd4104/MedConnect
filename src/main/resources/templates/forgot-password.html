<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Quên mật khẩu - MedConnect</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gradient-to-r from-blue-50 to-indigo-100 min-h-screen flex flex-col font-sans antialiased">

<div class="fixed top-4 right-4 z-50">
    <a href="/" class="text-indigo-500 hover:text-indigo-700 transition-colors">
        <i class="fas fa-home w-12 h-12 text-3xl"></i>
    </a>
</div>

<section class="container mx-auto py-12 px-4 md:px-0 flex items-center justify-center min-h-screen">
    <div class="bg-white p-6 md:p-8 rounded-xl shadow-lg max-w-md w-full transform transition duration-300">
        <h1 class="text-4xl font-bold mb-8 text-center text-indigo-800 drop-shadow-md">Quên mật khẩu</h1>

        <div th:if="${error}" class="mb-6 p-4 bg-red-100 border border-red-400 text-red-700 rounded-lg text-center flex items-center justify-center">
            <i class="fas fa-exclamation-circle mr-2"></i>
            <span th:text="${error}"></span>
        </div>

        <div th:if="${success}" class="mb-6 p-4 bg-green-100 border border-green-400 text-green-700 rounded-lg text-center flex items-center justify-center">
            <i class="fas fa-check-circle mr-2"></i>
            <span th:text="${success}"></span>
        </div>

        <form th:action="@{/forgot-password}" method="post" class="space-y-6" th:if="${success == null}">
            <p class="text-gray-600 text-center">Vui lòng nhập email của bạn. Chúng tôi sẽ gửi một liên kết để đặt lại mật khẩu.</p>
            <div>
                <label for="email" class="block text-sm font-medium text-gray-700 mb-1 flex items-center">
                    <i class="fas fa-envelope mr-2 text-indigo-500"></i> Email
                </label>
                <input type="email" id="email" name="email" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500" required>
            </div>
            <button type="submit" class="w-full bg-indigo-600 text-white py-3 px-6 rounded-lg font-semibold hover:bg-indigo-700 transition flex items-center justify-center">
                <i class="fas fa-paper-plane mr-2"></i> Gửi link
            </button>
        </form>

        <div class="mt-4 text-center">
            <a href="/login" class="text-indigo-600 hover:text-indigo-800 font-medium transition block">Quay lại Đăng nhập</a>
        </div>
    </div>
</section>

</body>
</html>
