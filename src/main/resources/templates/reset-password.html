<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Đặt lại mật khẩu - MedConnect</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gradient-to-r from-blue-50 to-indigo-100 min-h-screen flex flex-col font-sans antialiased">

<section class="container mx-auto py-12 px-4 md:px-0 flex items-center justify-center min-h-screen">
    <div class="bg-white p-6 md:p-8 rounded-xl shadow-lg max-w-md w-full transform transition duration-300">
        <h1 class="text-4xl font-bold mb-8 text-center text-indigo-800 drop-shadow-md">Tạo mật khẩu mới</h1>

        <div th:if="${error}" class="mb-6 p-4 bg-red-100 border border-red-400 text-red-700 rounded-lg text-center flex items-center justify-center">
            <i class="fas fa-exclamation-circle mr-2"></i>
            <span th:text="${error}"></span>
        </div>

        <form th:action="@{/reset-password}" th:object="${resetPasswordDTO}" method="post" class="space-y-6" th:if="${resetPasswordDTO != null}">
            <input type="hidden" th:field="*{token}" />

            <div>
                <label for="password" class="block text-sm font-medium text-gray-700 mb-1 flex items-center">
                    <i class="fas fa-lock mr-2 text-indigo-500"></i> Mật khẩu mới
                </label>
                <input type="password" id="password" th:field="*{password}" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500" required>
                <span th:if="${#fields.hasErrors('password')}" th:errors="*{password}" class="text-red-500 text-sm"></span>
            </div>
            <div>
                <label for="confirmPassword" class="block text-sm font-medium text-gray-700 mb-1 flex items-center">
                    <i class="fas fa-lock mr-2 text-indigo-500"></i> Xác nhận mật khẩu
                </label>
                <input type="password" id="confirmPassword" th:field="*{confirmPassword}" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500" required>
                <span th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}" class="text-red-500 text-sm"></span>
            </div>
            <button type="submit" class="w-full bg-indigo-600 text-white py-3 px-6 rounded-lg font-semibold hover:bg-indigo-700 transition flex items-center justify-center">
                <i class="fas fa-save mr-2"></i> Lưu mật khẩu
            </button>
        </form>

        <div class="mt-4 text-center" th:if="${error != null}">
            <a href="/login" class="text-indigo-600 hover:text-indigo-800 font-medium transition block">Quay lại Đăng nhập</a>
        </div>
    </div>
</section>

</body>
</html>
