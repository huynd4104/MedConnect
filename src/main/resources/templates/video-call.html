<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Video call - MedConnect</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script defer src="https://unpkg.com/@zegocloud/zego-uikit-prebuilt/zego-uikit-prebuilt.js"></script>

    <th:block th:replace="~{fragments/header :: firebase-scripts}"></th:block>
</head>
<body class="bg-gradient-to-br from-slate-50 via-blue-50 to-indigo-50 min-h-screen flex flex-col font-sans antialiased">
<div th:replace="~{fragments/header :: header}"></div>

<section class="flex-1 flex flex-col px-4 py-6 md:px-8 md:py-8 max-w-[1920px] mx-auto w-full">

    <!-- Error Message -->
    <div th:if="${error}" class="mb-6 p-5 bg-red-50 border-l-4 border-red-500 text-red-700 rounded-lg flex items-center shadow-sm">
        <i class="fas fa-exclamation-circle text-xl mr-3"></i>
        <span th:text="${error}" class="font-medium"></span>
    </div>

    <!-- Main Video Container Card -->
    <div class="flex-1 bg-white rounded-2xl shadow-xl overflow-hidden flex flex-col">

        <!-- Header Bar -->
        <div class="bg-gradient-to-r from-indigo-600 to-blue-600 px-6 py-4 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 bg-white/20 rounded-lg flex items-center justify-center">
                    <i class="fas fa-video text-white text-lg"></i>
                </div>
                <div>
                    <h2 class="text-xl font-semibold text-white">Phòng tư vấn trực tuyến</h2>
                    <p class="text-indigo-100 text-sm">Kết nối video an toàn & bảo mật</p>
                </div>
            </div>

            <button id="customFullscreenBtn" class="px-5 py-2.5 bg-white/10 hover:bg-white/20 backdrop-blur-sm text-white rounded-lg transition duration-200 flex items-center space-x-2 border border-white/20">
                <i class="fas fa-expand text-sm"></i>
                <span id="fullscreenBtnText" class="font-medium">Toàn màn hình</span>
            </button>
        </div>

        <!-- Video Display Area -->
        <div class="flex-1 bg-gradient-to-br from-slate-900 to-slate-800 relative min-h-[500px] md:min-h-[600px] lg:min-h-[700px]">
            <div id="videoContainer" class="w-full h-full absolute inset-0"></div>
        </div>

    </div>
</section>

<script th:inline="javascript">
    function toggleFullScreen() {
        const elem = document.getElementById('videoContainer');
        const btnText = document.getElementById('fullscreenBtnText');
        const btnIcon = document.querySelector('#customFullscreenBtn i');

        if (!document.fullscreenElement && !document.webkitFullscreenElement && !document.mozFullScreenElement && !document.msFullscreenElement) {
            // Enter fullscreen
            if (elem.requestFullscreen) {
                elem.requestFullscreen();
            } else if (elem.webkitRequestFullscreen) {
                elem.webkitRequestFullscreen();
            } else if (elem.msRequestFullscreen) {
                elem.msRequestFullscreen();
            } else if (elem.mozRequestFullScreen) {
                elem.mozRequestFullScreen();
            }

            if(btnText) btnText.textContent = 'Thu nhỏ';
            if(btnIcon) btnIcon.classList.replace('fa-expand', 'fa-compress');
        } else {
            // Exit fullscreen
            if (document.exitFullscreen) {
                document.exitFullscreen();
            } else if (document.webkitExitFullscreen) {
                document.webkitExitFullscreen();
            } else if (document.msExitFullscreen) {
                document.msExitFullscreen();
            } else if (document.mozCancelFullScreen) {
                document.mozCancelFullScreen();
            }

            if(btnText) btnText.textContent = 'Toàn màn hình';
            if(btnIcon) btnIcon.classList.replace('fa-compress', 'fa-expand');
        }
    }

    function handleFullScreenChange() {
        const btnText = document.getElementById('fullscreenBtnText');
        const btnIcon = document.querySelector('#customFullscreenBtn i');
        if (!btnText || !btnIcon) return;

        if (!document.fullscreenElement && !document.webkitFullscreenElement && !document.mozFullScreenElement && !document.msFullscreenElement) {
            btnText.textContent = 'Toàn màn hình';
            btnIcon.classList.replace('fa-compress', 'fa-expand');
        } else {
            btnText.textContent = 'Thu nhỏ';
            btnIcon.classList.replace('fa-expand', 'fa-compress');
        }
    }

    window.onload = function() {
        const videoContainer = document.getElementById('videoContainer');
        const fullscreenBtn = document.getElementById('customFullscreenBtn');

        // Get data from Model
        const appId = /*[[${appId}]]*/ null;
        const roomID = /*[[${sessionId}]]*/ null;
        const userID = /*[[${userId}]]*/ null;
        const userName = /*[[${userName}]]*/ null;
        const serverToken = /*[[${token}]]*/ null;
        const error = /*[[${error}]]*/ null;

        if (error) {
            console.error("Lỗi khi vào phòng:", error);
            if (videoContainer) videoContainer.style.display = 'none';
            if (fullscreenBtn) fullscreenBtn.style.display = 'none';
        } else if (!appId || !roomID || !userID || !serverToken) {
            console.error("Thiếu thông tin cấu hình Zego.");
            if (videoContainer) videoContainer.style.display = 'none';
            if (fullscreenBtn) fullscreenBtn.style.display = 'none';
        } else {
            try {
                const kitToken = ZegoUIKitPrebuilt.generateKitTokenForProduction(
                    appId,
                    serverToken,
                    roomID,
                    userID,
                    userName
                );

                const zp = ZegoUIKitPrebuilt.create(kitToken);

                zp.joinRoom({
                    container: document.querySelector("#videoContainer"),
                    sharedLinks: [{
                        name: 'Link mời',
                        url: window.location.origin + window.location.pathname,
                    }],
                    scenario: {
                        mode: ZegoUIKitPrebuilt.OneONoneCall,
                    },
                    turnOnMicrophoneWhenJoining: true,
                    turnOnCameraWhenJoining: true,
                });
            } catch (e) {
                console.error("Lỗi khi khởi tạo Zego SDK:", e);
                if (videoContainer) {
                    videoContainer.innerHTML = '<p class="text-red-400 p-4 text-center">Lỗi Zego: ' + e.message + '</p>';
                }
            }
        }

        // Fullscreen button event
        if (fullscreenBtn) {
            fullscreenBtn.addEventListener('click', toggleFullScreen);
        }

        // Fullscreen change listeners
        document.addEventListener('fullscreenchange', handleFullScreenChange);
        document.addEventListener('webkitfullscreenchange', handleFullScreenChange);
        document.addEventListener('mozfullscreenchange', handleFullScreenChange);
        document.addEventListener('MSFullscreenChange', handleFullScreenChange);
    };
</script>

</body>
</html>
