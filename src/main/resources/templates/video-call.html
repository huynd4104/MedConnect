<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Video call - MedConnect</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/zego-uikit-prebuilt"></script> <!-- ZEGOCLOUD SDK -->
</head>
<body class="bg-gray-900 min-h-screen flex flex-col">
<header class="bg-indigo-500 text-white p-4 text-center">
    <h1 class="text-2xl font-bold">Video call tư vấn</h1>
</header>

<div th:if="${error}" class="mt-4 p-3 bg-red-100 border border-red-400 text-red-700 rounded-lg text-center" th:text="${error}"></div>

<section class="flex-1 flex items-center justify-center">
    <div id="videoContainer" class="w-full max-w-4xl h-96 bg-black rounded-lg shadow-md"></div>
</section>
<script th:inline="javascript">
    const appID = /*[[${app.zegocloud.app-id}]]*/ 1941948199;
    const serverSecret = /*[[${app.zegocloud.server-secret}]]*/ 'a2e06d622e55a46a53d2b6ce9b58d6d4';
    const roomID = /*[[${appointment.videoCallLink}]]*/ 'session_id';
    const userID = 'user_' + Math.random();
    const userName = 'User';
    const token = generateToken(); // Call backend VideoService to generate

    const zp = ZegoUIKitPrebuilt.create(token);
    zp.joinRoom({
        container: document.querySelector("#videoContainer"),
        sharedLinks: [{
            name: 'Personal link',
            url: window.location.origin + window.location.pathname + '?roomID=' + roomID,
        }],
        scenario: {
            mode: ZegoUIKitPrebuilt.OneONoneCall,
        },
        turnOnMicrophoneWhenJoining: true,
        turnOnCameraWhenJoining: true,
        showMyCameraToggleButton: true,
        showMyMicrophoneToggleButton: true,
        showAudioVideoSettingsButton: true,
        showScreenSharingButton: true,
        showTextChat: true,
        showUserList: true,
        maxUsers: 2,
        layout: "Auto",
        showLayoutButton: false,
    });
</script>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
