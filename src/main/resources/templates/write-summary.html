<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Viết tóm tắt/Đơn thuốc - MedConnect</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <th:block th:replace="~{fragments/header :: firebase-scripts}"></th:block>

    <style>
        /* Import font giống doctor-dashboard.html */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }

        /* Gradient text giống doctor-dashboard.html */
        .gradient-text {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col antialiased">
<div th:replace="~{fragments/header :: header}"></div>

<section class="container mx-auto py-16 px-4">
    <div class="bg-white p-6 md:p-8 rounded-2xl border border-gray-100 shadow-xl max-w-2xl mx-auto transform transition duration-300">

        <div th:if="${error}" class="mb-6 p-4 bg-red-100 border border-red-400 text-red-700 rounded-xl text-center flex items-center justify-center">
            <i class="fas fa-exclamation-circle mr-2"></i>
            <span th:text="${error}"></span>
        </div>

        <div class="mb-6">
            <h2 class="text-3xl font-semibold mb-6 text-gray-900 flex items-center">
                <i class="fas fa-info-circle mr-3 text-purple-600"></i> Tóm tắt lịch hẹn
            </h2>
            <p class="text-gray-700"><span class="font-medium">Bệnh nhân:</span> <span th:text="${appointment.patient.fullName}"></span></p>
            <p class="text-gray-700"><span class="font-medium">Thời gian:</span> <span th:text="${#temporals.format(appointment.appointmentDateTime, 'HH:mm dd/MM/yyyy')}"></span></p>
        </div>

        <form th:action="@{/write-summary}" th:object="${consultationDocumentDTO}" method="post" class="space-y-6">
            <input type="hidden" th:field="*{appointmentId}" />
            <div>
                <label for="documentType" class="block text-sm font-medium text-gray-700 mb-1 flex items-center">
                    <i class="fas fa-file-alt mr-2 text-purple-600"></i> Loại tài liệu
                </label>
                <select th:field="*{documentType}" id="documentType" class="w-full p-3 border border-gray-300 rounded-xl focus:ring-purple-500 focus:border-purple-500">
                    <option value="Summary">Tóm tắt</option>
                    <option value="Prescription">Đơn thuốc</option>
                </select>
                <span th:if="${#fields.hasErrors('documentType')}" th:errors="*{documentType}" class="text-red-500 text-sm"></span>
            </div>
            <div>
                <label for="content" class="block text-sm font-medium text-gray-700 mb-1 flex items-center">
                    <i class="fas fa-align-left mr-2 text-purple-600"></i> Nội dung
                </label>
                <textarea th:field="*{content}" id="content" class="w-full p-3 border border-gray-300 rounded-xl focus:ring-purple-500 focus:border-purple-500" rows="8"></textarea>
                <span th:if="${#fields.hasErrors('content')}" th:errors="*{content}" class="text-red-500 text-sm"></span>
            </div>
            <div class="flex flex-col md:flex-row gap-4 pt-4">
                <a th:href="@{/doctor-dashboard}" class="flex-1 bg-gray-300 text-gray-800 py-3 px-6 rounded-xl font-semibold hover:bg-gray-400 transition flex items-center justify-center text-center">
                    <i class="fas fa-arrow-left mr-2"></i> Quay lại
                </a>

                <button type="submit" class="flex-1 bg-purple-600 text-white py-3 px-6 rounded-xl font-semibold hover:bg-purple-700 transition transform hover:-translate-y-0.5 hover:shadow-lg flex items-center justify-center">
                    <i class="fas fa-paper-plane mr-2"></i> Gửi
                </button>
            </div>
        </form>
    </div>
</section>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
