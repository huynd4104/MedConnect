<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Hồ sơ bác sĩ - MedConnect</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gradient-to-r from-blue-50 to-indigo-100 min-h-screen flex flex-col font-sans antialiased">
<div th:replace="~{fragments/header :: header}"></div>

<section class="container mx-auto py-12 px-4 md:px-0">
    <h1 class="text-4xl font-bold mb-8 text-center text-indigo-800 drop-shadow-md">Hồ Sơ Bác Sĩ</h1>

    <div class="bg-white p-6 md:p-8 rounded-xl shadow-lg max-w-2xl mx-auto transform transition duration-300">
        <div th:if="${error}" class="mb-6 p-4 bg-red-100 border border-red-400 text-red-700 rounded-lg text-center flex items-center justify-center">
            <i class="fas fa-exclamation-circle mr-2"></i>
            <span th:text="${error}"></span>
        </div>
        <div th:if="${success}" class="mb-6 p-4 bg-green-100 border border-green-400 text-green-700 rounded-lg text-center flex items-center justify-center">
            <i class="fas fa-check-circle mr-2"></i>
            <span th:text="${success}"></span>
        </div>

        <form th:action="@{/doctor-profile}" th:object="${doctorProfileDTO}" method="post" enctype="multipart/form-data" class="space-y-6">
            <div>
                <label for="specializationId" class="block text-sm font-medium text-gray-700 mb-1 flex items-center">
                    <i class="fas fa-stethoscope mr-2 text-indigo-500"></i> Chuyên khoa
                </label>
                <select th:field="*{specializationId}" id="specializationId" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500">
                    <option value="">-- Chọn chuyên khoa --</option>
                    <option th:each="spec : ${specializations}" th:value="${spec.specializationId}" th:text="${spec.name}"></option>
                </select>
            </div>

            <div>
                <label for="fullName" class="block text-sm font-medium text-gray-700 mb-1 flex items-center">
                    <i class="fas fa-user mr-2 text-indigo-500"></i> Họ và Tên
                </label>
                <input type="text" th:field="*{fullName}" id="fullName" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500">
                <span th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}" class="text-red-500 text-sm"></span>
            </div>

            <div>
                <label for="phoneNumber" class="block text-sm font-medium text-gray-700 mb-1 flex items-center">
                    <i class="fas fa-phone mr-2 text-indigo-500"></i> Số điện thoại
                </label>
                <input type="tel" th:field="*{phoneNumber}" id="phoneNumber" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500">
                <span th:if="${#fields.hasErrors('phoneNumber')}" th:errors="*{phoneNumber}" class="text-red-500 text-sm"></span>
            </div>

            <div>
                <label for="clinicAddress" class="block text-sm font-medium text-gray-700 mb-1 flex items-center">
                    <i class="fas fa-map-marker-alt mr-2 text-indigo-500"></i> Địa chỉ phòng khám
                </label>
                <input type="text" th:field="*{clinicAddress}" id="clinicAddress" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500">
                <span th:if="${#fields.hasErrors('clinicAddress')}" th:errors="*{clinicAddress}" class="text-red-500 text-sm"></span>
            </div>

            <div>
                <label for="experienceYears" class="block text-sm font-medium text-gray-700 mb-1 flex items-center">
                    <i class="fas fa-briefcase mr-2 text-indigo-500"></i> Số năm kinh nghiệm
                </label>
                <input type="number" th:field="*{experienceYears}" id="experienceYears" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500">
            </div>

            <div>
                <label for="licenseNumber" class="block text-sm font-medium text-gray-700 mb-1 flex items-center">
                    <i class="fas fa-certificate mr-2 text-indigo-500"></i> Số giấy phép
                </label>
                <input type="text" th:field="*{licenseNumber}" id="licenseNumber" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500">
            </div>

            <div>
                <label for="photo" class="block text-sm font-medium text-gray-700 mb-1 flex items-center">
                    <i class="fas fa-camera mr-2 text-indigo-500"></i> Ảnh đại diện
                </label>
                <div th:if="*{existingPhotoPath}" class="my-2">
                    <img th:src="@{${doctorProfileDTO.existingPhotoPath}}" alt="Ảnh đại diện hiện tại" class="w-24 h-24 rounded-full object-cover border-2 border-gray-200 mx-auto">
                </div>
                <input type="file" name="photo" id="photo" class="w-full p-2 border border-gray-300 rounded-lg file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100">
                <p class="text-xs text-gray-500 mt-1">Để trống nếu bạn không muốn thay đổi ảnh đại diện.</p>
            </div>

            <div>
                <label for="credentials" class="block text-sm font-medium text-gray-700 mb-1 flex items-center">
                    <i class="fas fa-file-upload mr-2 text-indigo-500"></i> Tải lên giấy tờ mới
                </label>
                <input type="file" name="credentials" id="credentials" multiple class="w-full p-2 border border-gray-300 rounded-lg file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100">
                <p class="text-xs text-gray-500 mt-1">Bạn có thể chọn nhiều file cùng lúc.</p>
            </div>

            <div class="flex items-center justify-between pt-4">
                <a href="./doctor-dashboard" class="bg-gray-300 text-gray-800 py-3 px-6 rounded-lg font-semibold hover:bg-gray-400 transition flex items-center">
                    <i class="fas fa-arrow-left mr-2"></i> Quay lại
                </a>
                <button type="submit" class="bg-indigo-600 text-white py-3 px-8 rounded-lg font-semibold hover:bg-indigo-700 transition focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 flex items-center">
                    <i class="fas fa-paper-plane mr-2"></i> Gửi duyệt
                </button>
            </div>
        </form>

        <div th:if="${doctorProfileDTO.existingDocuments != null && !doctorProfileDTO.existingDocuments.isEmpty()}" class="mt-8 pt-6 border-t border-gray-200">
            <h2 class="text-2xl font-semibold mb-6 text-indigo-700 flex items-center">
                <i class="fas fa-folder-open mr-2 text-indigo-500"></i> Các giấy tờ đã tải lên
            </h2>
            <ul class="space-y-2">
                <li th:each="doc : ${doctorProfileDTO.existingDocuments}" class="flex items-center justify-between p-2 rounded-md hover:bg-gray-50 transition">
                    <a th:href="@{${doc.filePath}}" th:text="${doc.fileName}" target="_blank" class="text-indigo-600 hover:text-indigo-800 font-medium flex-grow transition"></a>
                    <form th:action="@{/delete-document/{id}(id=${doc.documentId})}" method="post" onsubmit="return confirm('Bạn có chắc chắn muốn xóa tài liệu này không?');">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                        <button type="submit" class="text-red-500 hover:text-red-700 text-sm font-semibold ml-4 flex items-center">
                            <i class="fas fa-trash mr-1"></i> Xóa
                        </button>
                    </form>
                </li>
            </ul>
        </div>
    </div>
</section>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
