<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      xmlns="http://www.w3.org/1999/html">
<head>
    <meta charset="UTF-8">
    <title>Đăng nhập - MedConnect</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* Import font giống doctor-dashboard.html */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }

        /* Gradient text giống doctor-dashboard.html */
        .gradient-text {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col antialiased">

<div class="fixed top-4 right-4 z-50">
    <a href="/" class="text-purple-600 hover:text-purple-800 transition-colors">
        <i class="fas fa-home w-12 h-12 text-3xl"></i>
    </a>
</div>

<section class="container mx-auto py-12 px-4 md:px-0 flex items-center justify-center min-h-screen">
    <div class="bg-white p-6 md:p-8 rounded-2xl border border-gray-100 shadow-xl max-w-md w-full transform transition duration-300">

        <h1 class="text-4xl font-bold mb-8 text-center gradient-text">Đăng nhập</h1>

        <div th:if="${error}" class="mb-6 p-4 bg-red-100 border border-red-400 text-red-700 rounded-xl text-center flex items-center justify-center">
            <i class="fas fa-exclamation-circle mr-2"></i>
            <span th:text="${error}"></span>
        </div>

        <div th:if="${success}" class="mb-6 p-4 bg-green-100 border border-green-400 text-green-700 rounded-xl text-center flex items-center justify-center">
            <i class="fas fa-check-circle mr-2"></i>
            <span th:text="${success}"></span>
        </div>

        <form th:action="@{/login}" th:object="${loginDTO}" method="post" class="space-y-6">
            <div>
                <label for="email" class="block text-sm font-medium text-gray-700 mb-1 flex items-center">
                    <i class="fas fa-envelope mr-2 text-purple-600"></i> Email
                </label>
                <input type="email" id="email" name="username" th:field="*{email}" class="w-full p-3 border border-gray-300 rounded-xl focus:ring-purple-500 focus:border-purple-500">
                <span th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="text-red-500 text-sm"></span>
            </div>
            <div>
                <label for="password" class="block text-sm font-medium text-gray-700 mb-1 flex items-center">
                    <i class="fas fa-lock mr-2 text-purple-600"></i> Mật khẩu
                </label>
                <input type="password" id="password" name="password" th:field="*{password}" class="w-full p-3 border border-gray-300 rounded-xl focus:ring-purple-500 focus:border-purple-500">
                <span th:if="${#fields.hasErrors('password')}" th:errors="*{password}" class="text-red-500 text-sm"></span>
            </div>

            <button type="submit" class="w-full bg-purple-600 text-white py-3 px-6 rounded-xl font-semibold hover:bg-purple-700 transition transform hover:-translate-y-0.5 hover:shadow-lg flex items-center justify-center">
                <i class="fas fa-sign-in-alt mr-2"></i> Đăng nhập
            </button>
        </form>

        <div class="mt-4 flex justify-center">
            <a href="/oauth2/authorization/google" class="flex items-center justify-center w-12 h-12 bg-white border border-gray-300 rounded-full shadow-md hover:bg-gray-100 transition">
                <span class="text-2xl font-bold text-red-500">G</span>
            </a>
        </div>

        <div class="mt-4 text-center space-y-2">
            <a href="/forgot-password" class="text-purple-600 hover:text-purple-800 font-medium transition block">Quên mật khẩu?</a>
            <a href="/register" class="text-purple-600 hover:text-purple-800 font-medium transition block">Đăng ký</a>
        </div>
    </div>
</section>

</body>
</html>
