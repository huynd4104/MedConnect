<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Đăng nhập - MedConnect</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-r from-blue-100 to-indigo-100 min-h-screen flex items-center justify-center">

<!-- Icon Home ở góc phải trên -->
<div class="fixed top-4 right-4 z-50">
    <a href="/" class="text-indigo-500 hover:text-indigo-700 transition-colors">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-12 h-12">
            <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 12l8.954-8.955c.44-.439 1.152-.439 1.591 0L21.75 12M4.5 9.75v10.125c0 .621.504 1.125 1.125 1.125H9.75v-4.875c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125V21h4.125c.621 0 1.125-.504 1.125-1.125V9.75M8.25 21h8.25" />
        </svg>
    </a>
</div>

<section class="container mx-auto bg-white p-8 rounded-lg shadow-md max-w-md">
    <h1 class="text-3xl font-bold mb-6 text-center">Đăng nhập</h1>

    <div th:if="${error}" class="mt-4 p-3 bg-red-100 border border-red-400 text-red-700 rounded-lg text-center" th:text="${error}"></div>

    <form th:action="@{/login}" th:object="${loginDTO}" method="post" class="space-y-4">
        <div>
            <label for="email" class="block text-sm font-medium">Email</label>
            <input type="email" id="email" name="username" th:field="*{email}" class="w-full p-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
            <span th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="text-red-500 text-sm"></span>
        </div>
        <div>
            <label for="password" class="block text-sm font-medium">Mật khẩu</label>
            <input type="password" id="password" name="password" th:field="*{password}" class="w-full p-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
            <span th:if="${#fields.hasErrors('password')}" th:errors="*{password}" class="text-red-500 text-sm"></span>
        </div>
        <button type="submit" class="w-full bg-indigo-500 text-white p-3 rounded-lg font-semibold hover:bg-indigo-600 transition">Đăng nhập</button>
    </form>
    <div class="mt-4 text-center">
        <a href="/forgot-password" class="text-indigo-500 hover:underline">Quên mật khẩu?</a>
        <a href="/register" class="text-indigo-500 hover:underline">Đăng Ký</a>
    </div>
    <div class="mt-4 flex justify-center gap-4">
        <a href="/oauth2/authorization/google" class="bg-red-500 text-white px-4 py-2 rounded hover:bg-red-600">Google</a>
        <a href="/oauth2/authorization/facebook" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">Facebook</a>
    </div>
</section>

</body>
</html>
