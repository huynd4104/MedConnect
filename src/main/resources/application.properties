# Server Config
server.port=8080
server.servlet.context-path=/

# Encryption
encryption.secret-key=MedConnectSecret

# Datasource SQL Server
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=MedConnectDB;encrypt=true;trustServerCertificate=true;sendTimeAsDatetime=false
spring.datasource.username=sa
spring.datasource.password=123
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServer2012Dialect
spring.jpa.properties.hibernate.format_sql=true

# Flyway
spring.flyway.enabled=false
spring.flyway.locations=classpath:db/migration

# Thymeleaf
spring.thymeleaf.cache=false 
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# Session Config
spring.session.store-type=jdbc 
spring.session.jdbc.initialize-schema=always
spring.session.jdbc.table-name=SPRING_SESSION

# Cache Config
spring.cache.type=simple

# Quartz Config (for cron jobs: reminders, expire bookings, archive)
spring.quartz.job-store-type=memory
spring.quartz.jdbc.initialize-schema=always
spring.quartz.properties.org.quartz.scheduler.instanceName=MedConnectScheduler
spring.quartz.properties.org.quartz.scheduler.instanceId=AUTO
spring.quartz.properties.org.quartz.threadPool.threadCount=5

